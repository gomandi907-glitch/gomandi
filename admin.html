<style>
:root{--g:#0c831f;--g2:#087316;--bg:#f5f7f6;--card:#fff;--text:#172019;--muted:#718078;--line:#e2e8e4;--red:#d92d20;--amber:#a86200;--blue:#2563eb;--shadow:0 5px 22px rgba(20,40,25,.07);--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}body{min-height:100vh}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--text);outline:0;font-size:14px}textarea{min-height:96px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(12,131,31,.08)}
.app{min-height:100vh;padding-bottom:78px}.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 14px calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}.brandmark{width:38px;height:38px;border-radius:12px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:900}.topbar h1{font-size:17px;margin:0;font-weight:900}.topbar small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.live{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:10px;font-weight:900;color:var(--g)}.dot{width:8px;height:8px;border-radius:50%;background:var(--g)}.dot.off{background:var(--red)}
.view{padding:12px;max-width:760px;margin:auto}.hero{background:linear-gradient(135deg,#0c831f,#0a9a2b);color:#fff;border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-bottom:12px}.hero h2{margin:0 0 5px;font-size:22px}.hero p{margin:0;opacity:.9;font-size:12px;line-height:1.5}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:12px}.quick button{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;text-align:left;box-shadow:var(--shadow);min-height:72px}.quick b{display:block;font-size:13px}.quick span{display:block;color:var(--muted);font-size:10px;margin-top:4px}.section{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:13px;margin-bottom:12px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.section-head h3{margin:0;font-size:15px}.section-head p{margin:3px 0 0;color:var(--muted);font-size:10px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:11px;padding:10px 12px;background:#eef3ef;color:#27332b;font-size:12px;font-weight:900}.btn.green{background:var(--g);color:#fff}.btn.red{background:#fff0ef;color:var(--red)}.btn.amber{background:#fff4df;color:var(--amber)}.btn.blue{background:#edf4ff;color:var(--blue)}.btn.full{width:100%}.btn.small{padding:7px 9px;font-size:10px}.row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:13px;padding:10px;background:#fff;margin-bottom:8px}.row:last-child{margin-bottom:0}.row .grow{min-width:0;flex:1}.row strong{display:block;font-size:13px;overflow-wrap:anywhere}.row small{display:block;color:var(--muted);font-size:10px;margin-top:3px;line-height:1.35}.thumb{width:54px;height:54px;object-fit:cover;border-radius:11px;background:#eef2ef;flex:none}.actions{display:flex;gap:5px;flex-wrap:wrap}.field{margin-bottom:11px}.field:last-child{margin-bottom:0}.field label{display:block;font-size:10px;font-weight:900;color:#58665e;margin:0 0 5px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--shadow)}.stat b{font-size:22px}.stat span{display:block;color:var(--muted);font-size:10px;margin-top:4px;font-weight:800}.chip{display:inline-flex;border-radius:999px;padding:5px 8px;background:#edf7ee;color:var(--g);font-size:9px;font-weight:900}.chip.red{background:#fff0ef;color:var(--red)}.chip.amber{background:#fff4df;color:var(--amber)}.muted{color:var(--muted);font-size:11px;line-height:1.45}.empty{padding:24px;text-align:center;color:var(--muted);font-size:12px}.searchbar{margin-bottom:10px}.searchbar input{background:#fff}.list{display:grid;gap:8px}.mini-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.mini-card{border:1px solid var(--line);border-radius:13px;padding:10px;background:#fff}.mini-card img{width:100%;height:92px;object-fit:cover;border-radius:10px;background:#eef2ef}.mini-card strong{font-size:11px;display:block;margin-top:7px}.mini-card small{font-size:9px;color:var(--muted);display:block;margin-top:3px}.order-card{border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:9px;background:#fff}.order-top{display:flex;justify-content:space-between;gap:8px}.order-id{font-size:13px;font-weight:900}.order-customer{font-size:12px;font-weight:800;margin-top:8px}.order-address,.order-items{font-size:10px;color:#5f6c64;line-height:1.5;margin-top:4px}.order-total{font-size:18px;font-weight:900;margin-top:8px}.status-select{margin-top:8px}.jsonbox{background:#f6f8f7;border:1px solid var(--line);padding:10px;border-radius:11px;font-size:10px;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}.notice{background:#fff8e7;border:1px solid #f2dfae;color:#765000;padding:10px;border-radius:11px;font-size:10px;line-height:1.5;margin-bottom:10px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.98);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.bottom button{background:transparent;border-radius:11px;padding:7px 3px;color:#6d7771;font-size:9px;font-weight:900}.bottom button.active{color:var(--g);background:#edf8ee}.bottom .ico{font-size:18px;display:block;margin-bottom:3px}.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:flex-end}.sheet.open{display:flex}.sheetbox{background:#fff;border-radius:20px 20px 0 0;width:100%;max-height:92vh;overflow:auto;padding:14px 13px calc(18px + env(safe-area-inset-bottom))}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;background:#fff;padding-bottom:10px;z-index:2}.sheet-head h2{font-size:17px;margin:0}.close{width:36px;height:36px;border-radius:12px;background:#eef2ef;font-size:18px}.navsheet{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.45);display:none}.navsheet.open{display:block}.navbox{width:min(340px,88vw);height:100%;background:#fff;padding:18px 14px;overflow:auto}.navbox h2{margin:0 0 3px;font-size:20px}.navbox p{margin:0 0 14px;color:var(--muted);font-size:10px}.navbtn{width:100%;text-align:left;background:#f7f9f8;border:1px solid var(--line);padding:12px;border-radius:12px;margin-bottom:7px;font-weight:900;font-size:12px}.navbtn.active{background:#edf8ee;color:var(--g);border-color:#cce8cf}.seg{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.seg button{white-space:nowrap}.upload-note{font-size:9px;color:var(--muted);margin-top:4px}.mf-gallery-file-inputs{display:grid;gap:6px}.divider{height:1px;background:var(--line);margin:12px 0}.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);padding:11px;border-radius:12px}.toggle input{width:auto}
@media(min-width:800px){body{background:#eef2ef}.app{max-width:520px;margin:auto;background:var(--bg);min-height:100vh;box-shadow:0 0 50px rgba(0,0,0,.08)}.topbar{max-width:520px;margin:auto}.bottom{max-width:520px;left:50%;transform:translateX(-50%)}.view{padding:14px}.hero{padding:20px}.quick{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1fr 1fr}}
</style>

<body>
<div class="app">
<header class="topbar"><button class="close" onclick="openNav()">☰</button><div class="brandmark">MF</div><div><h1 id="title">Admin Home</h1><small>Live Firebase Control</small></div><div class="live"><i class="dot" id="dot"></i><span id="conn">Connecting…</span></div></header>
<main class="view" id="view"></main>
<nav class="bottom">
<button id="bHome" onclick="go('home')"><span class="ico">⌂</span>Home</button>

</nav>
</div>
<div class="navsheet" id="navsheet" onclick="if(event.target===this)closeNav()"><div class="navbox"><div style="display:flex;justify-content:space-between;align-items:center"><div><h2>Maa Food Admin</h2><p>Everything in one live Firebase panel.</p></div><button class="close" onclick="closeNav()">×</button></div><button class="navbtn" onclick="go('home');closeNav()">⌂ Home</button><button class="navbtn" onclick="go('catalog');closeNav()">▦ Categories & Products</button><button class="navbtn" onclick="go('homeproducts');closeNav()">🛍 Homepage Products</button><button class="navbtn" onclick="go('orders');closeNav()">🛒 Orders & Cancellations</button><button class="navbtn" onclick="go('complaints');closeNav()">⚠ Complaints</button><button class="navbtn" onclick="go('users');closeNav()">👤 Users & Client Data</button><button class="navbtn" onclick="go('audit');closeNav()">📦 Stock Audit / Inventory</button><button class="navbtn" onclick="go('pickercontrol');closeNav()">🧍 Picker App Control</button><button class="navbtn" onclick="go('deliverycontrol');closeNav()">🏍 Delivery App Control</button><button class="navbtn" onclick="go('ratings');closeNav()">⭐ App Ratings</button><button class="navbtn" onclick="go('content');closeNav()">✦ Homepage Builder</button><button class="navbtn" onclick="go('festival');closeNav()">🎉 Festival</button><button class="navbtn" onclick="go('banners');closeNav()">▣ Banners</button><button class="navbtn" onclick="go('settings');closeNav()">⚙ App & Login Settings</button><button class="navbtn" onclick="go('notices');closeNav()">🔔 Notices</button><button class="navbtn" onclick="go('coupons');closeNav()">🎟 Coupon Code</button><button class="navbtn" onclick="go('servicearea');closeNav()">📍 Service Area / Map Range</button></div></div>
<div class="sheet" id="sheet"><div class="sheetbox"><div class="sheet-head"><h2 id="sheetTitle">Edit</h2><button class="close" onclick="closeSheet()">×</button></div><div id="sheetBody"></div></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyC6Lr5tFasxTiOKQCAg9k2aEyf9-oiIGnk",authDomain:"mandigomart.firebaseapp.com",databaseURL:"https://mandigomart-default-rtdb.firebaseio.com",projectId:"mandigomart",storageBucket:"mandigomart.firebasestorage.app",messagingSenderId:"476945286618",appId:"1:476945286618:web:f519af3fb480cce777ace3",measurementId:"G-0J65M21H3B"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const db=firebase.database();let storage=null;try{storage=firebase.storage()}catch(e){}
const S={tab:'home',data:{},group:'bestsellers',selectedCat:null,selectedSub:null,productSearch:'',orderSearch:'',festivalCard:null};
const tabs={home:'Admin Home',catalog:'Catalog',homeproducts:'Homepage Products',orders:'Orders & Cancellations',complaints:'Complaints',users:'Users & Client Data',content:'Homepage Builder',festival:'Festival',banners:'Banners',settings:'App & Login Settings',notices:'Notices',audit:'Stock Audit / Inventory',pickers:'Picker Management',riders:'Rider Management',pickercontrol:'Picker App Control',deliverycontrol:'Delivery App Control',coupons:'Coupon Code',servicearea:'Service Area / Map Range'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=v=>Array.isArray(v)?v:(v&&typeof v==='object'?Object.entries(v).map(([id,x])=>({...x,id:x?.id||id})):[]);
const key=s=>String(s??'').replace(/[.#$\[\]\/]/g,'_');
const id=(p='id')=>p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
const data=k=>S.data[k];
function notify(m,type='success'){
  let t=document.getElementById('mfAdminToast');
  if(!t){t=document.createElement('div');t.id='mfAdminToast';t.style.cssText='position:fixed;left:50%;top:18px;transform:translate(-50%,-20px);z-index:9999;max-width:92vw;padding:12px 16px;border-radius:14px;background:#0c831f;color:#fff;font:800 13px Inter,system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:.2s';document.body.appendChild(t)}
  t.textContent=String(m||'Saved successfully');t.style.background=type==='error'?'#d92d20':type==='info'?'#2563eb':'#0c831f';t.style.opacity='1';t.style.transform='translate(-50%,0)';clearTimeout(window.__mfAdminToastTimer);window.__mfAdminToastTimer=setTimeout(()=>{t.style.opacity='0';t.style.transform='translate(-50%,-20px)'},1800);
}
let __mfSheetSaving=false;
function beginSheetSave(){if(__mfSheetSaving){notify('Saving… please wait','info');return false}__mfSheetSaving=true;document.querySelectorAll('#sheet .sheetbox button').forEach(b=>{if(!b.classList.contains('close'))b.disabled=true});return true}
function resetSheetSave(){__mfSheetSaving=false;document.querySelectorAll('#sheet .sheetbox button').forEach(b=>b.disabled=false)}
window.__mfImageUploadPromises=window.__mfImageUploadPromises||{};
async function waitForImageUploads(ids,timeout=60000){
  const jobs=ids.map(idv=>window.__mfImageUploadPromises[idv]).filter(Boolean);
  if(jobs.length){
    try{await Promise.race([Promise.allSettled(jobs),new Promise((_,rej)=>setTimeout(()=>rej(new Error('upload-timeout')),timeout))]);}
    catch(e){return false}
  }
  const start=Date.now();
  while(Date.now()-start<timeout){
    let busy=false;
    for(const idv of ids){const el=document.getElementById(idv);if(el?.dataset?.uploading==='1'){busy=true;break}}
    if(!busy)return true;
    await new Promise(r=>setTimeout(r,100));
  }
  return false;
}
function openNav(){document.getElementById('navsheet').classList.add('open')};function closeNav(){document.getElementById('navsheet').classList.remove('open')}
function openSheet(title,body){document.getElementById('sheetTitle').textContent=title;document.getElementById('sheetBody').innerHTML=body;document.getElementById('sheet').classList.add('open')}
function closeSheet(){document.getElementById('sheet').classList.remove('open');resetSheetSave()}
function V(id){return document.getElementById(id)?.value??''};function C(id){return !!document.getElementById(id)?.checked}
function setp(p,v){return db.ref(p).set(v).then(()=>{notify('Saved successfully','success');return v})};function delp(p){return db.ref(p).remove().then(()=>{notify('Deleted successfully','success')})}
function cats(){return arr(data('categories')).filter(x=>x&&x.name&&x.name!=='All Products')};function prods(){return arr(data('products'))}
function subs(cat){return Array.isArray(data('category_subs')?.[cat])?data('category_subs')[cat]:[]}
function pickersList(){return arr(data('pickers'))}
function ridersList(){return arr(data('riders'))}
function penaltiesList(){return arr(data('penalties'))}
function penaltySettings(){return data('penalty_settings')||{defaultAmount:12}}
function nextSeqId(list,prefix){let max=1000;list.forEach(x=>{const m=new RegExp('^'+prefix+'-(\\d+)$').exec(x.id||'');if(m)max=Math.max(max,Number(m[1]))});return prefix+'-'+(max+1)}
function groupList(g){return Array.isArray(data('app_settings')?.homepage?.categoryGroups?.[g])?[...data('app_settings').homepage.categoryGroups[g]]:[]}
function homeHeaders(){return data('section_headers')||{}}
function updateStatus(){db.ref('.info/connected').on('value',s=>{const on=!!s.val();document.getElementById('conn').textContent=on?'Firebase Live':'Offline';document.getElementById('dot').classList.toggle('off',!on)})}
function listen(){const paths=['app_settings','categories','category_subs','products','orders','users','client_data','promo_banners','section_headers','festival_home','festival_card_products','admin','complaints','notices','pickers','riders','stock_audit_history','worker_settings','penalties','penalty_settings','coupons','serviceAreas'];paths.forEach(p=>db.ref(p).on('value',s=>{S.data[p]=s.val();render()}));updateStatus()}
function setActiveBottom(){['Home','Catalog','Orders','Content'].forEach(x=>document.getElementById('b'+x)?.classList.remove('active'));const map={home:'Home',catalog:'Catalog',orders:'Orders',content:'Content'};document.getElementById('b'+(map[S.tab]||'More'))?.classList.add('active')}
function go(tab){S.tab=tab;document.getElementById('title').textContent=tabs[tab]||'Admin';setActiveBottom();render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){const fn={home:renderHome,catalog:renderCatalog,homeproducts:renderHomeProducts,orders:renderOrders,complaints:renderComplaints,users:renderUsers,content:renderContent,festival:renderFestival,banners:renderBanners,settings:renderSettings,notices:renderNotices,audit:renderAudit,pickers:renderPickers,riders:renderRiders,pickercontrol:renderPickerControl,deliverycontrol:renderDeliveryControl,coupons:renderCoupons,servicearea:(typeof renderServiceArea==='function'?renderServiceArea:renderHome)}[S.tab]||renderHome;fn()}
function renderHome(){const p=prods(),c=cats(),o=arr(data('orders')||data('admin')?.orders),u=arr(data('users')),cmp=arr(data('complaints'));document.getElementById('view').innerHTML=`<div class="hero"><h2>Live Admin Control</h2><p>यह panel उसी Firebase database को live पढ़ता और लिखता है जो customer app use करता है। कोई अलग demo data नहीं है.</p></div><div class="statgrid"><div class="stat"><b>${p.length}</b><span>Products</span></div><div class="stat"><b>${c.length}</b><span>Categories</span></div><div class="stat"><b>${o.length}</b><span>Orders</span></div><div class="stat"><b>${u.length}</b><span>Users</span></div></div><div class="section"><div class="section-head"><div><h3>Quick Add</h3><p>जिस चीज़ को बनाना है सीधे खोलो.</p></div></div><div class="quick"><button onclick="productForm()"><b>＋ Product</b><span>Product add/edit</span></button><button onclick="categoryForm()"><b>＋ Category</b><span>Main category</span></button><button onclick="subcategoryForm()"><b>＋ Subcategory</b><span>Category के अंदर</span></button><button onclick="extraSectionForm()"><b>＋ Home Section</b><span>New headline + products</span></button></div></div><div class="section"><div class="section-head"><div><h3>Live Modules</h3><p>सब modules Firebase से जुड़े हैं.</p></div></div><div class="list"><div class="row" onclick="go('catalog')"><div class="grow"><strong>Category → Subcategory → Product</strong><small>Dedicated products रखने का सबसे safe तरीका.</small></div><span>›</span></div><div class="row" onclick="go('homeproducts')"><div class="grow"><strong>Sweet Tooth / Cold Drinks & Juices</strong><small>Homepage product sections और headlines.</small></div><span>›</span></div><div class="row" onclick="go('festival')"><div class="grow"><strong>Festival</strong><small>Festival hero, cards/columns और dedicated products.</small></div><span>›</span></div><div class="row" onclick="go('settings')"><div class="grow"><strong>Login + App + Floating Products</strong><small>Customer panel का live control.</small></div><span>›</span></div></div></div>`}
function renderCatalog(){const group=groupList(S.group);const selected=S.selectedCat;const list=selected?subs(selected):[];document.getElementById('view').innerHTML=`<div class="seg"><button class="btn ${S.group==='bestsellers'?'green':''}" onclick="S.group='bestsellers';S.selectedCat=null;render()">Bestsellers</button><button class="btn ${S.group==='groceryKitchen'?'green':''}" onclick="S.group='groceryKitchen';S.selectedCat=null;render()">Grocery & Kitchen</button><button class="btn blue" onclick="categoryGroupManager()">＋ New Home Category Group</button></div><div class="section"><div class="section-head"><div><h3>${esc(S.group==='bestsellers'?'Bestsellers':'Grocery & Kitchen')} categories</h3><p>Headline और category order यहीं control करो.</p></div><button class="btn green" onclick="categoryForm()">＋ Category</button></div><div class="field"><label>Headline</label><input id="groupHeadline" value="${esc(homeHeaders()[S.group]|| (S.group==='bestsellers'?'Bestsellers':'Grocery & Kitchen'))}"><button class="btn green full" style="margin-top:7px" onclick="saveGroupHeadline()">Save Headline</button></div>${group.map((n,i)=>{const c=cats().find(x=>x.name===n);return `<div class="row"><img class="thumb" src="${esc(c?.image||'')}" onerror="this.style.visibility='hidden'"><div class="grow" onclick="selectCatalogCat('${encodeURIComponent(n)}')"><strong>${esc(n)}</strong><small>${subs(n).length} subcategories • ${prods().filter(p=>p.category===n).length} products</small></div><div class="actions"><button class="btn small" onclick="moveGroup('${esc(S.group)}',${i},-1)">↑</button><button class="btn small" onclick="moveGroup('${esc(S.group)}',${i},1)">↓</button><button class="btn small" onclick="removeFromGroup('${esc(S.group)}',${encodeURIComponent(n)})">Remove</button></div></div>`}).join('')||'<div class="empty">No categories in this group. Add one below.</div>'}<button class="btn full" style="margin-top:8px" onclick="addExistingCategoryToGroup()">＋ Add Existing Category to This Group</button></div>${selected?renderSelectedCatalog(selected,list):'<div class="section"><div class="empty">ऊपर किसी category के नाम पर tap करो। फिर उसके अंदर subcategories और dedicated products दिखेंगे.</div></div>'}`}

function categoryForm(encoded=''){const old=encoded?decodeURIComponent(encoded):'';const c=cats().find(x=>x.name===old)||{name:'',image:''};openSheet(old?'Edit Category':'Add Main Category',`<div class="field"><label>Category name</label><input id="catName" value="${esc(c.name)}"></div><div class="field"><label>Image URL</label><input id="catImage" value="${esc(c.image||'')}"><div class="upload-note">या नीचे से image upload करो.</div><input type="file" accept="image/*" onchange="uploadTo(this,'catImage','admin/categories')"></div><button class="btn green full" onclick="saveCategory('${encodeURIComponent(old)}')">Save Category</button>`)}
async function saveCategory(enc){if(!beginSheetSave())return;const old=decodeURIComponent(enc||'');const name=V('catName').trim();if(!name){resetSheetSave();return notify('Category name required','error')}if(!await waitForImageUploads(['catImage'])){resetSheetSave();return notify('Image is still uploading. Please wait a moment.','error')}const image=V('catImage').trim();let a=cats();if(a.some(c=>c.name===name&&c.name!==old)){resetSheetSave();return notify('This category already exists.','error')}if(old){const i=a.findIndex(c=>c.name===old);if(i>=0)a[i]={...a[i],name,image};if(old!==name){const sub=data('category_subs')?.[old];if(sub!==undefined){await delp('category_subs/'+key(old));await setp('category_subs/'+key(name),sub)};const h=data('app_settings')?.homepage?.categoryGroups||{};for(const g of Object.keys(h)){if(Array.isArray(h[g])){const n=h[g].map(x=>x===old?name:x);await setp('app_settings/homepage/categoryGroups/'+g,n)}}} }else a.push({name,image});await setp('categories',a);closeSheet()}
async function deleteCategory(enc){const n=decodeURIComponent(enc);if(!confirm('Delete '+n+'? Products will remain, but the category card will be removed.'))return;await setp('categories',cats().filter(c=>c.name!==n));await delp('category_subs/'+key(n));for(const g of ['bestsellers','groceryKitchen'])await setp('app_settings/homepage/categoryGroups/'+g,groupList(g).filter(x=>x!==n))}
function subcategoryForm(encCat=encodeURIComponent(S.selectedCat||''),index=-1){const cat=decodeURIComponent(encCat||'');if(!cat)return notify('Select a parent category first');const a=subs(cat),x=index>=0?a[index]:{name:'',image:''};openSheet(index>=0?'Edit Subcategory':'Add Subcategory',`<div class="field"><label>Parent category</label><input value="${esc(cat)}" disabled></div><div class="field"><label>Subcategory name</label><input id="subName" value="${esc(x.name||'')}"></div><div class="field"><label>Subcategory image</label><input id="subImage" value="${esc(x.image||'')}"><input type="file" accept="image/*" onchange="uploadTo(this,'subImage','admin/subcategories')"></div><button class="btn green full" onclick="saveSub('${encodeURIComponent(cat)}',${index})">Save Subcategory</button>`)}
async function saveSub(enc,index){if(!beginSheetSave())return;const cat=decodeURIComponent(enc),a=[...subs(cat)],x={name:V('subName').trim(),image:V('subImage').trim()};if(!x.name){resetSheetSave();return notify('Subcategory name required','error')}if(!await waitForImageUploads(['subImage'])){resetSheetSave();return notify('Image is still uploading. Please wait a moment.','error')}if(a.some((s,i)=>i!==index&&s.name===x.name)){resetSheetSave();return notify('This subcategory already exists in this category.','error')}if(index>=0)a[index]=x;else a.push(x);await setp('category_subs/'+key(cat),a);closeSheet()}
async function deleteSub(enc,index){const cat=decodeURIComponent(enc),a=[...subs(cat)];if(!confirm('Delete this subcategory? Existing products are not deleted.'))return;a.splice(index,1);await setp('category_subs/'+key(cat),a)}

/* Product media uploads: keep the original file in Firebase Storage so the
   customer panel receives the source resolution instead of the old 480px
   compressed data URL. Existing category/banner upload flow is untouched. */
function addGalleryFileInput(){
  const wrap=document.getElementById('mfGalleryFileInputs');
  if(!wrap)return;
  const count=wrap.querySelectorAll('input[type=file]').length;
  if(count>=6)return notify('Maximum 6 gallery upload slots available','info');
  const row=document.createElement('div');
  row.style.cssText='display:flex;gap:7px;align-items:center;margin-top:7px';
  row.innerHTML=`<input type="file" accept="image/*" onchange="uploadProductMedia(this,'pGalleryUrls',true)" style="flex:1"><button type="button" class="btn red small" onclick="this.parentElement.remove()">Remove</button>`;
  wrap.appendChild(row);
}

async function uploadProductMedia(input,targetId,multiple=false){
  const files=[...(input?.files||[])];
  if(!files.length)return;
  const target=document.getElementById(targetId);
  if(target)target.dataset.uploading='1';
  const job=(async()=>{
    try{
      const urls=[];
      for(const file of files){
        if(!/^image\//i.test(file.type))continue;
        let url='';
        if(storage){
          try{
            const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
            const ref=storage.ref(`admin/products/${Date.now()}_${Math.random().toString(36).slice(2,8)}_${safeName}`);
            const uploadTask=ref.put(file,{contentType:file.type,cacheControl:'public,max-age=31536000'});
            const snap=await Promise.race([uploadTask,new Promise((_,rej)=>setTimeout(()=>rej(new Error('storage-timeout')),30000))]);
            url=await snap.ref.getDownloadURL();
          }catch(storageError){
            // If Firebase Storage is slow/unavailable in the WebView, use the built-in local fallback.
            url=await imageToDataUrl(file,2048,.88);
          }
        }else{
          url=await imageToDataUrl(file,2048,.88);
        }
        if(url)urls.push(url);
      }
      if(target){
        if(multiple){
          const old=target.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
          target.value=[...old,...urls].join('\n');
        }else if(urls[0]) target.value=urls[0];
        target.dataset.uploading='';
        target.dispatchEvent(new Event('input',{bubbles:true}));
      }
      const previewWrap=input.parentElement;
      if(previewWrap && urls.length){
        let preview=previewWrap.querySelector('.mf-upload-preview');
        if(!preview){preview=document.createElement('img');preview.className='mf-upload-preview';preview.style.cssText='width:100%;max-height:180px;object-fit:contain;border-radius:12px;margin-top:8px;background:#f4f5f4';previewWrap.appendChild(preview)}
        preview.src=urls[0];
      }
      notify(urls.length?`Image${urls.length>1?'s':''} uploaded successfully`:'No valid image selected','success');
      return urls;
    }catch(e){
      if(target)target.dataset.uploading='';
      notify('Product image upload failed: '+(e?.message||e),'error');
      return [];
    }finally{
      if(target)target.dataset.uploading='';
      delete window.__mfImageUploadPromises[targetId];
    }
  })();
  window.__mfImageUploadPromises[targetId]=job;
  return job;
}

function renderProductVariantRows(variants){
  const rows=Array.isArray(variants)&&variants.length?variants:[{unit:'',price:'',mrp:'',label:''}];
  return rows.slice(0,6).map((v,i)=>`
    <div class="mf-variant-row" data-variant-index="${i}">
      <div class="mf-variant-head"><strong>Unit option ${i+1}</strong><button type="button" class="btn red small" onclick="removeProductVariantRow(${i})">Remove</button></div>
      <div class="two">
        <div class="field"><label>Unit / Pack</label><input class="mf-v-unit" value="${esc(v?.unit||'')}" placeholder="1 kg / Pack of 2"></div>
        <div class="field"><label>Price (₹)</label><input class="mf-v-price" type="number" min="0" value="${esc(v?.price??'')}"></div>
      </div>
      <div class="two">
        <div class="field"><label>MRP (₹)</label><input class="mf-v-mrp" type="number" min="0" value="${esc(v?.mrp??'')}"></div>
        <div class="field"><label>Optional label</label><input class="mf-v-label" value="${esc(v?.label||'')}" placeholder="Pack of 1"></div>
      </div>
      <div class="field"><label>Per-unit price text (optional)</label><input class="mf-v-per" value="${esc(v?.perUnitPrice||'')}" placeholder="e.g. ₹253/100 g — khali = app khud calculate karega"></div>
    </div>`).join('');
}

function addProductVariantRow(){
  const wrap=document.getElementById('mfVariantRows'); if(!wrap)return;
  const count=wrap.querySelectorAll('.mf-variant-row').length;
  if(count>=6)return notify('Maximum 6 unit options allowed','info');
  wrap.insertAdjacentHTML('beforeend',renderProductVariantRows([{unit:'',price:'',mrp:'',label:''}]).replace('data-variant-index="0"',`data-variant-index="${count}"`));
}

function removeProductVariantRow(index){
  const wrap=document.getElementById('mfVariantRows'); if(!wrap)return;
  const rows=[...wrap.querySelectorAll('.mf-variant-row')];
  if(rows.length<=1){return notify('Keep at least one unit option','info')}
  rows[index]?.remove();
  [...wrap.querySelectorAll('.mf-variant-row')].forEach((row,i)=>{
    row.dataset.variantIndex=i;
    const h=row.querySelector('.mf-variant-head strong'); if(h)h.textContent=`Unit option ${i+1}`;
    const b=row.querySelector('.mf-variant-head button'); if(b)b.setAttribute('onclick',`removeProductVariantRow(${i})`);
  });
}

function readProductVariants(){
  return [...document.querySelectorAll('#mfVariantRows .mf-variant-row')].map(row=>{
    const o={
      unit:row.querySelector('.mf-v-unit')?.value.trim()||'',
      price:Number(row.querySelector('.mf-v-price')?.value||0),
      mrp:Number(row.querySelector('.mf-v-mrp')?.value||0),
      label:row.querySelector('.mf-v-label')?.value.trim()||''
    };
    const per=row.querySelector('.mf-v-per')?.value.trim()||'';
    if(per)o.perUnitPrice=per;
    return o;
  }).filter(v=>v.unit||v.label||v.price>0);
}

function mfWireVariantSync(){
  const wrap=document.getElementById('mfVariantRows');
  const top={price:document.getElementById('pPrice'),mrp:document.getElementById('pMrp'),unit:document.getElementById('pUnit')};
  if(!wrap||!top.price||!top.mrp||!top.unit)return;
  const first=()=>wrap.querySelector('.mf-variant-row');
  const map=[['price','.mf-v-price'],['mrp','.mf-v-mrp'],['unit','.mf-v-unit']];
  map.forEach(([k,sel])=>top[k].addEventListener('input',()=>{const r=first();const el=r&&r.querySelector(sel);if(el)el.value=top[k].value;}));
  wrap.addEventListener('input',e=>{const r=e.target.closest('.mf-variant-row');if(!r||r!==first())return;map.forEach(([k,sel])=>{if(e.target.matches(sel))top[k].value=e.target.value;});});
}

function refreshProductSub(){const cat=V('pCat'),a=subs(cat),sel=document.getElementById('pSub');if(!sel)return;sel.innerHTML='<option value="">No subcategory</option>'+a.map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('')}
async function saveProduct(enc='',encSectionId=''){
  if(!beginSheetSave())return;
  const old=decodeURIComponent(enc||'');
  const idv=old||V('pId').trim()||id('product');
  const sectionId=encSectionId?decodeURIComponent(encSectionId):'';

  if(document.getElementById('pVideoUrl')?.dataset.uploading==='1'){
    resetSheetSave();return notify('Video abhi upload ho raha hai — complete hone ka wait karo.','error');
  }
  if(!await waitForImageUploads(['pImage','pGalleryUrls'])){
    resetSheetSave();return notify('Image is still uploading. Please wait a moment.','error');
  }

  const image=V('pImage').trim();
  const gallery=V('pGalleryUrls').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const mediaUrls=[...new Set([image,...gallery].filter(Boolean))];
  const variants=readProductVariants();
  const first=variants[0]||{unit:V('pUnit').trim(),price:Number(V('pPrice')||0),mrp:Number(V('pMrp')||0),label:''};

  const oldp=prods().find(x=>x.id===old);
  const detailConfig={
    ...(oldp?.detailConfig||{}),
    showUnitSelector:C('pUnitSelector') && variants.length>1,
    showViewDetails:C('pShowViewDetails'),
    showReplacement:C('pShowReplacement'),
    showBrand:C('pShowBrand'),
    showShelfLife:C('pShowShelf'),
    showFoodType:C('pShowFood'),
    showPrice:C('pShowPrice'),
    showMrp:C('pShowMrp'),
    showUnit:C('pShowUnit'),
    showCartBar:C('pShowCart'),
    showDescription:true,
    showSimilarProducts:true,
    showPackType:true,
    showFlavour:true,
    showRating:true,
    showDeliveryTime:true,
    packType:first.label||first.unit||'',
    flavour:V('pFlavour').trim(),
    replacementButtonText:V('pReplacementButtonText').trim()||'Submit to order replacement',
    replacementText:V('pReplacement').trim()||'72 hours only replacement',
    rating:V('pRating').trim()||'5',
    ratingText:V('pRatingText').trim(),
    brandLogo:V('pBrandLogo').trim(),
    imageHeight:Math.max(220,Math.min(520,Number(V('pImageHeight')||360))),
    imageFit:V('pImageFit')==='cover'?'cover':'contain'
  };

  const x={
    ...(oldp||{}),
    id:idv,
    title:V('pTitle').trim(),
    category:V('pCat'),
    subCategory:V('pSub'),
    price:Number(first.price||V('pPrice')||0),
    mrp:Number(first.mrp||V('pMrp')||0),
    unit:first.unit||V('pUnit').trim(),
    stock:Number(V('pStock')||0),
    brand:V('pBrand').trim(),
    time:V('pTime').trim()||'10 MINS',
    foodType:V('pFood'),
    discount:V('pDiscount').trim(),
    desc:V('pDesc').trim(),
    shelfLife:V('pShelf').trim(),
    mediaUrls,
    image:image||mediaUrls[0]||'',
    variants:variants.length?variants:[{unit:V('pUnit').trim(),price:Number(V('pPrice')||0),mrp:Number(V('pMrp')||0),label:''}],
    detailConfig,
    videoUrl:V('pVideoUrl').trim(),
    perUnitPrice:V('pPerUnit').trim(),
    attributes:[0,1,2,3,4].map(i=>({heading:V('pAttrH'+i).trim(),value:V('pAttrV'+i).trim()})).filter(a=>a.heading&&a.value),
    barcode:V('pBarcode').trim(),
    updatedAt:Date.now()
  };

  if(!x.title){resetSheetSave();return notify('Product name required','error')}
  if(S.data.products===undefined){resetSheetSave();return notify('Products are still loading — please wait a moment and save again.','error')}
  let list=[...prods()];
  const i=list.findIndex(p=>p.id===idv);
  if(i>=0)list[i]=x;else list.push(x);
  await setp('products',list);

  if(sectionId){
    const sections=[...(data('app_settings')?.homepage?.extraProductSections||[])];
    const secIndex=sections.findIndex(s=>s.id===sectionId);
    if(secIndex>=0){
      const pIds=Array.isArray(sections[secIndex].productIds)?[...sections[secIndex].productIds]:[];
      if(!pIds.includes(idv))pIds.push(idv);
      sections[secIndex]={...sections[secIndex],productIds:pIds,mode:'products'};
      await setp('app_settings/homepage/extraProductSections',sections);
    }
  }
  if(C('pUnitSelector')&&variants.length<2)notify('Unit selector needs at least 2 unit options — saved with selector OFF.','info');
  closeSheet();
}

async function deleteProduct(enc){const idv=decodeURIComponent(enc);if(!confirm('Delete this product?'))return;/* Remove from products array */await setp('products',prods().filter(p=>p.id!==idv));/* Also remove productId from any extra section's productIds so it doesn't appear in search or homepage */const sections=[...(data('app_settings')?.homepage?.extraProductSections||[])];let changed=false;sections.forEach(s=>{if(Array.isArray(s.productIds)&&s.productIds.includes(idv)){s.productIds=s.productIds.filter(id=>id!==idv);changed=true;}});if(changed)await setp('app_settings/homepage/extraProductSections',sections);}

/* ===================== STOCK AUDIT / INVENTORY CONTROL ===================== */
function auditOrderList(){return arr(data('orders')||data('admin')?.orders)}
function auditItems(o){return Array.isArray(o?.items)?o.items:(o?.items&&typeof o.items==='object'?Object.values(o.items):[])}
function auditItemQty(it){return Number(it?.qty??it?.quantity??1)||1}
function auditProductId(it){return String(it?.productId||it?.id||'')}
function auditStatus(o){return String(o?.orderStatus||'Placed')}
function auditSoldMap(){
  const m={};
  auditOrderList().forEach(o=>{
    if(auditStatus(o)==='Cancelled')return;
    auditItems(o).forEach(it=>{const pid=auditProductId(it);if(pid)m[pid]=(m[pid]||0)+auditItemQty(it);});
  });
  return m;
}
function auditHistory(){return arr(data('stock_audit_history'));}
function auditRevenue(){
  return auditOrderList().filter(o=>auditStatus(o)!=='Cancelled').reduce((n,o)=>n+Number(o?.billBreakdown?.grandTotal??o?.totalAmount??o?.total??0),0);
}
function renderAudit(){
  const products=prods(), soldMap=auditSoldMap(), q=String(S.auditSearch||'').toLowerCase();
  const filtered=products.filter(p=>!q||String(p.title||'').toLowerCase().includes(q)||String(p.id||'').toLowerCase().includes(q)||String(p.barcode||'').toLowerCase().includes(q));
  const totalStock=products.reduce((n,p)=>n+Math.max(0,Number(p.stock||0)),0);
  const soldUnits=Object.values(soldMap).reduce((n,v)=>n+v,0);
  const out=products.filter(p=>Number(p.stock||0)<=0).length;
  const low=products.filter(p=>Number(p.stock||0)>0&&Number(p.stock||0)<=5).length;
  const history=auditHistory().slice().sort((a,b)=>Number(b.at||0)-Number(a.at||0)).slice(0,25);
  document.getElementById('view').innerHTML=`<div class="section"><div class="section-head"><div><h3>📦 Stock Audit / Inventory</h3><p>सारे live products, current stock, sold quantity, barcode और stock history एक जगह.</p></div><span class="chip">LIVE</span></div><div class="statgrid"><div class="stat"><b>${products.length}</b><span>Total products</span></div><div class="stat"><b>${totalStock}</b><span>Current stock units</span></div><div class="stat"><b>${soldUnits}</b><span>Units sold (non-cancelled)</span></div><div class="stat"><b>${out}</b><span>Out of stock</span></div><div class="stat"><b>${low}</b><span>Low stock ≤ 5</span></div><div class="stat"><b>${fmtMoney(auditRevenue())}</b><span>Order value (non-cancelled)</span></div></div></div><div class="section"><div class="searchbar"><input placeholder="Search product / ID / barcode…" value="${esc(S.auditSearch||'')}" oninput="S.auditSearch=this.value;render()"></div>${filtered.map(p=>{const stock=Math.max(0,Number(p.stock||0)),sold=Number(soldMap[p.id]||0);return `<div class="row" style="align-items:flex-start"><img class="thumb" src="${esc((p.mediaUrls||[])[0]||p.image||'')}"><div class="grow"><strong>${esc(p.title||'Product')}</strong><small>ID: ${esc(p.id||'-')} • Barcode: ${esc(p.barcode||'Not set')}<br>Current Stock: <b>${stock}</b> • Sold: <b>${sold}</b> • Total tracked: ${stock+sold}</small></div><div class="actions" style="flex-direction:column"><button class="btn small" onclick="auditAdjustStock('${encodeURIComponent(p.id)}',1)">＋1</button><button class="btn small" onclick="auditAdjustStock('${encodeURIComponent(p.id)}',-1)">−1</button><button class="btn blue small" onclick="auditStockSheet('${encodeURIComponent(p.id)}')">Details</button></div></div>`}).join('')||'<div class="empty">No products found.</div>'}</div><div class="section"><div class="section-head"><div><h3>Recent Stock Audit History</h3><p>Manual stock corrections / restocks. Order sales remain traceable from Orders.</p></div></div>${history.map(h=>`<div class="row"><div class="grow"><strong>${esc(h.productTitle||h.productId||'Product')}</strong><small>${h.delta>0?'Restock':'Adjustment'} ${h.delta>0?'+':''}${Number(h.delta||0)} • ${esc(h.reason||'Manual adjustment')}<br>${h.at?new Date(h.at).toLocaleString('en-IN'):''}</small></div><strong>${esc(h.after??'-')}</strong></div>`).join('')||'<div class="empty">No manual stock adjustments yet.</div>'}</div>`;
}
function auditStockSheet(enc){
  const pid=decodeURIComponent(enc),p=prods().find(x=>x.id===pid);if(!p)return;
  const sold=Number(auditSoldMap()[pid]||0),stock=Math.max(0,Number(p.stock||0));
  openSheet('Stock Details — '+esc(p.title||pid),`<div class="section"><div class="muted">Product ID: <b>${esc(pid)}</b><br>Barcode: <b>${esc(p.barcode||'Not set')}</b><br>Current stock: <b>${stock}</b><br>Non-cancelled sold quantity: <b>${sold}</b><br>Tracked total: <b>${stock+sold}</b></div></div><div class="field"><label>Stock adjustment</label><input id="auditDelta" type="number" step="1" value="0"></div><div class="field"><label>Reason</label><input id="auditReason" value="Manual stock adjustment" placeholder="Restock / damaged / correction"></div><button class="btn green full" onclick="saveAuditAdjustment('${encodeURIComponent(pid)}')">Save Stock Adjustment</button>`);
}
async function auditAdjustStock(enc,delta){
  const pid=decodeURIComponent(enc),d=Number(delta||0);if(!pid||!d)return;
  const p=prods().find(x=>x.id===pid);if(!p)return;
  const reason=d>0?'Quick restock +1':'Quick stock correction -1';
  await saveAuditDelta(pid,d,reason);
}
async function saveAuditAdjustment(enc){const pid=decodeURIComponent(enc),d=Number(V('auditDelta')||0),reason=V('auditReason').trim()||'Manual stock adjustment';if(!d)return notify('Adjustment 0 है','error');await saveAuditDelta(pid,d,reason);closeSheet()}
async function saveAuditDelta(pid,delta,reason){
  let after=0,prodTitle='';
  await db.ref('products').transaction(function(current){
    if(!current)return current;
    const list=Array.isArray(current)?current.slice():Object.keys(current).sort((a,b)=>Number(a)-Number(b)).map(k=>current[k]);
    const i=list.findIndex(x=>x&&String(x.id)===String(pid));if(i<0)return current;
    const cur=Math.max(0,Number(list[i].stock??0)),next=Math.max(0,cur+Number(delta));after=next;prodTitle=list[i].title||pid;list[i]={...list[i],stock:next,updatedAt:Date.now()};return list;
  });
  const h={id:id('audit'),productId:pid,productTitle:prodTitle,delta:Number(delta),before:Math.max(0,after-Number(delta)),after,reason:String(reason||''),at:Date.now()};
  const hist=[...auditHistory(),h].slice(-300);
  await db.ref('stock_audit_history').set(hist);notify('Stock updated live','success');render();
}

function findOrderById(orderId){if(!orderId)return null;return arr(data('orders')||data('admin')?.orders).find(o=>o.orderId===orderId||o.id===orderId)}
function ensurePenaltyForComplaint(c){
  if(c.penaltyId)return;
  window.__mfPenaltyLock=window.__mfPenaltyLock||{};
  if(window.__mfPenaltyLock[c.id])return;
  window.__mfPenaltyLock[c.id]=true;
  const order=findOrderById(c.orderId);
  const pickerId=c.pickerId||order?.pickerId||'';
  const pickerName=c.pickerName||order?.pickerName||'';
  const pen={id:id('penalty'),complaintId:c.id,orderId:c.orderId||'',pickerId,pickerName,amount:Number(penaltySettings().defaultAmount||12),status:'Pending',createdAt:Date.now()};
  const list=[...penaltiesList(),pen];
  db.ref('penalties').set(list).then(()=>db.ref('complaints/'+key(c.id)).update({penaltyId:pen.id,pickerId,pickerName}));
}
function penaltyBlockHtml(c){
  const pen=penaltiesList().find(x=>x.id===c.penaltyId)||penaltiesList().find(x=>x.complaintId===c.id);
  const pickerId=c.pickerId||pen?.pickerId||'';
  const pickerName=c.pickerName||pen?.pickerName||'';
  let statusHtml='<div class="muted">Penalty record बन रहा है…</div>';
  if(pen){
    if(pen.status==='Confirmed')statusHtml=`<div class="chip red">₹${Number(pen.amount)} PENALTY CONFIRMED</div><div class="muted" style="margin-top:4px">Decided ${pen.decisionAt?new Date(pen.decisionAt).toLocaleString():''}</div>`;
    else if(pen.status==='Rejected')statusHtml=`<div class="chip">PENALTY REJECTED — no deduction</div><div class="muted" style="margin-top:4px">Decided ${pen.decisionAt?new Date(pen.decisionAt).toLocaleString():''}</div>`;
    else statusHtml=`<div class="chip amber">₹${Number(pen.amount)} PENALTY — PENDING REVIEW</div><div class="field" style="margin-top:8px"><label>Penalty amount for this complaint (₹)</label><input id="penAmt_${esc(pen.id)}" type="number" min="0" step="0.5" value="${Number(pen.amount)}"></div><div class="actions"><button class="btn green small" onclick="approvePenalty('${encodeURIComponent(pen.id)}')">Approve — Confirm Penalty</button><button class="btn red small" onclick="rejectPenalty('${encodeURIComponent(pen.id)}')">Reject Complaint</button></div>`;
  }
  return `<div class="divider"></div><div class="two"><div class="field"><label>Picker ID</label><input id="cPickerId_${esc(c.id)}" value="${esc(pickerId)}" placeholder="Order से auto-fill होगा"></div><div class="field"><label>Picker Name</label><input id="cPickerName_${esc(c.id)}" value="${esc(pickerName)}"></div></div><button class="btn blue small" onclick="savePickerLink('${encodeURIComponent(c.id)}')">Save Picker Link</button><div style="margin-top:10px">${statusHtml}</div>`;
}
async function approvePenalty(enc){
  const pidv=decodeURIComponent(enc);
  const amt=Number(document.getElementById('penAmt_'+pidv)?.value||0);
  let list=[...penaltiesList()];const i=list.findIndex(x=>x.id===pidv);if(i<0)return;
  const pen=list[i];list[i]={...pen,amount:amt,status:'Confirmed',decisionAt:Date.now()};
  await setp('penalties',list);
  if(pen.pickerId){let pk=[...pickersList()];const pi=pk.findIndex(x=>x.id===pen.pickerId);if(pi>=0){pk[pi]={...pk[pi],penaltyTotal:Number(pk[pi].penaltyTotal||0)+amt};await db.ref('pickers').set(pk);}}
  notify('₹'+amt+' penalty confirmed');
}
async function rejectPenalty(enc){
  const pidv=decodeURIComponent(enc);
  let list=[...penaltiesList()];const i=list.findIndex(x=>x.id===pidv);if(i<0)return;
  list[i]={...list[i],status:'Rejected',decisionAt:Date.now()};

async function savePickerLink(enc){

}

function orderById(idv){return (data('orders')||data('admin')?.orders||{})[idv]||null}
/* Stock refund helper (new, additive) — mirrors the same safe transaction used in the customer app so cancelling from Admin also returns stock. */
function mfApplyStockDeltaAdmin(items,sign){if(!items||!items.length)return Promise.resolve();return db.ref('products').transaction(function(current){if(!current)return current;let list=Array.isArray(current)?current.slice():Object.keys(current).sort((a,b)=>Number(a)-Number(b)).map(k=>current[k]);items.forEach(function(it){const pid=String((it&&(it.id||it.productId))||'');if(!pid)return;const idx=list.findIndex(function(p){return p&&String(p.id)===pid});if(idx<0)return;const qty=Number((it&&(it.qty||it.quantity))||1);let cur=Number(list[idx].stock);if(isNaN(cur))cur=10;let next=cur+sign*qty;if(next<0)next=0;list[idx]=Object.assign({},list[idx],{stock:next})});return list})}
function mfRefundStockForOrderAdmin(order){try{const items=(order&&order.items)||[];return mfApplyStockDeltaAdmin(items,1)}catch(e){console.error('Stock refund failed:',e);return Promise.resolve()}}
function fmtMoney(v){const n=Number(v||0);return '₹'+n.toLocaleString('en-IN')}
function orderItemsArray(o){const raw=o?.items;return Array.isArray(raw)?raw:(raw&&typeof raw==='object'?Object.values(raw):[])}
function humanOrderDetails(o,highlightIdx){
 const items=orderItemsArray(o),addr=o.deliveryAddress||o.address||'',name=o.receiverName||o.customerName||o.name||'Customer',phone=o.receiverPhone||o.customerPhone||o.phone||'',total=o.billBreakdown?.grandTotal??o.totalAmount??o.total??0,bd=o.billBreakdown||{};
 let itemHtml='';
 const hiSet=Array.isArray(highlightIdx)?highlightIdx.map(Number):null;
 if(items.length){itemHtml='<div class="divider"></div>'+items.map((it,idx)=>{const isHi=hiSet&&hiSet.includes(idx);return '<div class="row"'+(isHi?' style="border:2px solid #ff4d4f;border-radius:10px;padding:8px;background:#fff5f5;margin-bottom:6px"':'')+'><div class="grow"><strong>'+esc(it.title||it.name||'Product')+(isHi?' <span style="display:inline-block;margin-left:4px;font-size:10px;font-weight:800;color:#fff;background:#ff4d4f;border-radius:6px;padding:2px 6px;vertical-align:middle">COMPLAINT ITEM</span>':'')+'</strong><small>Quantity: '+esc(it.qty??it.quantity??1)+' '+esc(it.unit||it.piece||'')+(it.price!=null?' • '+fmtMoney(it.price):'')+'</small></div><strong>'+fmtMoney((Number(it.price||0)*Number(it.qty??it.quantity??1))||it.total||0)+'</strong></div>'}).join('')}else itemHtml='<div class="empty">No item details found.</div>';
 return '<div class="section"><h3>Customer</h3><div class="muted"><b style="font-size:14px;color:#172019">'+esc(name)+'</b><br>'+esc(phone)+'</div></div>'+
 '<div class="section"><h3>Delivery Address</h3><div class="muted"><b>'+esc(o.addressType||'Home')+'</b><br>'+esc(addr||'Address not provided')+'<br>'+esc(o.deliveryAreaOnly||o.area||'')+' '+esc(o.deliveryCity||o.city||'')+'</div></div>'+
 '<div class="section"><h3>Order</h3><div class="muted">Order ID: <b>'+esc(o.orderId||o.id||'')+'</b><br>Date: '+esc(o.orderDate||'')+'<br>Status: '+esc(o.orderStatus||'Placed')+'<br>Payment: '+esc(o.paymentMethod||'')+' • '+esc(o.paymentStatus||'')+'</div>'+itemHtml+'</div>'+
 '<div class="section"><h3>Bill Summary</h3><div class="muted">Items: '+fmtMoney(bd.itemsTotal)+'<br>Delivery: '+fmtMoney(bd.deliveryCharge)+'<br>Handling: '+fmtMoney(bd.handlingCharge)+'<br>COD Extra: '+fmtMoney(bd.codExtraCharge)+'<br>Tip: '+fmtMoney(bd.deliveryTip)+'<br><b style="font-size:18px;color:#172019">Grand Total: '+fmtMoney(total)+'</b></div></div>';
}
function orderDetails(enc){const idv=decodeURIComponent(enc),o=orderById(idv);if(!o)return;openSheet('Order '+idv,humanOrderDetails(o)+`<button class="btn green full" onclick="closeSheet()">Close</button>`)}
async function changeOrderStatus(enc,status){const idv=decodeURIComponent(enc),x=orderById(idv);if(!x)return;const wasCancelled=String(x.orderStatus||'')==='Cancelled';const u={orderStatus:status,updatedAt:Date.now()};await db.ref('orders/'+key(idv)).update(u);await db.ref('admin/orders/'+key(idv)).update(u);if(status==='Cancelled'&&!wasCancelled)mfRefundStockForOrderAdmin(x)}
async function cancelOrder(enc){const idv=decodeURIComponent(enc),x=orderById(idv);if(!x||!confirm('Cancel order '+idv+'?'))return;const wasCancelled=String(x.orderStatus||'')==='Cancelled';const u={orderStatus:'Cancelled',cancelledAt:Date.now(),cancelledBy:'Admin',cancelReason:'Cancelled by Admin'};await db.ref('orders/'+key(idv)).update(u);await db.ref('admin/orders/'+key(idv)).update(u);await db.ref('cancelled_orders/'+key(idv)).set({...x,...u});if(!wasCancelled)mfRefundStockForOrderAdmin(x)}

function complaintDetails(enc){
 const idv=decodeURIComponent(enc),c=data('complaints')?.[idv]||{},order=c.order||null,img=c.imageUrl||c.image||c.imageData||'';
 const highlightIdx=Array.isArray(c.productIndexes)&&c.productIndexes.length?c.productIndexes:(c.productIndex!=null&&c.productIndex!==''?[c.productIndex]:null);

 h+='<div class="section"><h3>Complaint</h3><div style="font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word">'+esc(c.complaintText||c.message||c.description||'No complaint text')+'</div></div>';
 if(c.productNames)h+='<div class="section"><h3>Complaint Product(s)</h3><div class="muted" style="font-size:13px;font-weight:700;color:#ff4d4f">'+esc(c.productNames)+'</div></div>';
 if(img)h+='<div class="section"><h3>Complaint Image</h3><img src="'+esc(img)+'" style="width:100%;max-height:360px;object-fit:contain;border-radius:14px;background:#f4f5f4"></div>';
 h+='<div class="section"><h3>Related Order</h3><div class="muted">Order ID: <b>'+esc(c.orderId||order?.orderId||'General complaint')+'</b><br>Status: '+esc(c.status||'Open')+'<br>Created: '+esc(c.createdAt?new Date(c.createdAt).toLocaleString('en-IN'):'')+'</div>'+(order?humanOrderDetails(order,highlightIdx):'')+'</div>';
 h+='<button class="btn green full" onclick="closeSheet()">Close</button><button class="btn red full" style="margin-top:8px" onclick="deleteComplaint(\''+encodeURIComponent(c.id||idv)+'\')">Delete Complaint</button>';
 openSheet('Complaint Details',h);
}

function renderCoupons(){const n=data('coupons')||{};const list=Object.entries(n).sort((a,b)=>(b[1]?.createdAt||0)-(a[1]?.createdAt||0));document.getElementById('view').innerHTML=`<div class="section"><div class="section-head"><div><h3>Coupon Code</h3><p>Discount coupons shown on the customer app checkout page.</p></div><button class="btn green" onclick="couponForm()">＋ Coupon</button></div>${list.map(([id,x])=>{const expired=x.expiresAt&&Date.now()>Number(x.expiresAt);const status=x.active===false?'OFF':(expired?'EXPIRED':'ACTIVE');const chipCls=status==='ACTIVE'?'':(status==='EXPIRED'?'red':'amber');return`<div class="row"><div class="grow"><strong>${esc(x.code||'')} <span class="chip ${chipCls}">${status}</span></strong><small>₹${Number(x.discountAmount||0)} off${x.headline?' • '+esc(x.headline):''}<br>${esc(fmtCouponExpiry(Number(x.expiresAt)))}</small></div><button class="btn small" onclick="couponForm('${encodeURIComponent(id)}')">Edit</button><button class="btn red small" onclick="deleteCoupon('${encodeURIComponent(id)}')">Delete</button></div>`}).join('')||'<div class="empty">No coupons yet. Create one to run a promo — e.g. for influencer codes.</div>'}</div>`}

function couponForm(enc=''){const idv=enc?decodeURIComponent(enc):id('coupon'),x=data('coupons')?.[idv]||{code:'',discountAmount:'',headline:'',active:true,durationPreset:'24',customHours:''};const presets=[['23','23 Hours'],['24','24 Hours'],['oneday','1 Day'],['today','Today (till midnight)'],['72','3 Days'],['custom','Custom']];const optsHtml=presets.map(([v,l])=>`<option value="${v}" ${String(x.durationPreset||'24')===v?'selected':''}>${l}</option>`).join('');openSheet(enc?'Edit Coupon':'Add Coupon',`<div class="field"><label>Coupon Code</label><input id="cCode" value="${esc(x.code)}" placeholder="e.g. SAVE10" style="text-transform:uppercase"></div><div class="field"><label>Discount Amount (₹ off)</label><input id="cDiscount" type="number" value="${esc(x.discountAmount)}" placeholder="e.g. 10"></div><div class="field"><label>Display Label (shown to user, optional)</label><input id="cHeadline" value="${esc(x.headline)}" placeholder="e.g. 10% OFF"></div><div class="field"><label>Expiry</label><select id="cExpiryPreset" onchange="toggleCouponCustomExpiry()">${optsHtml}</select></div><div class="field" id="cCustomHoursField" style="display:${x.durationPreset==='custom'?'block':'none'}"><label>Custom Hours</label><input id="cCustomHours" type="number" value="${esc(x.customHours)}" placeholder="e.g. 48"></div><div class="toggle"><span>Enabled</span><input id="cEnabled" type="checkbox" ${x.active!==false?'checked':''}></div><button class="btn green full" style="margin-top:10px" onclick="saveCoupon('${encodeURIComponent(idv)}')">Save Coupon</button>`)}
function computeCouponExpiry(preset,customHours){const now=Date.now();if(preset==='23')return now+23*3600000;if(preset==='24')return now+24*3600000;if(preset==='oneday')return now+24*3600000;if(preset==='72')return now+72*3600000;if(preset==='today'){const d=new Date();d.setHours(23,59,59,999);return d.getTime()}if(preset==='custom'){const h=Number(customHours)||24;return now+h*3600000}return now+24*3600000}
async function saveCoupon(enc){const idv=decodeURIComponent(enc);const code=V('cCode').trim().toUpperCase();const discountAmount=Number(V('cDiscount'))||0;if(!code){notify('Please enter a coupon code','error');return}if(discountAmount<=0){notify('Please enter a valid discount amount','error');return}const preset=V('cExpiryPreset');const customHours=V('cCustomHours');const expiresAt=computeCouponExpiry(preset,customHours);const existing=data('coupons')?.[idv];await setp('coupons/'+key(idv),{code,discountAmount,headline:V('cHeadline').trim(),active:C('cEnabled'),durationPreset:preset,customHours:preset==='custom'?(Number(customHours)||0):'',expiresAt,createdAt:existing?.createdAt||firebase.database.ServerValue.TIMESTAMP,updatedAt:firebase.database.ServerValue.TIMESTAMP});closeSheet()}

/* Replace only the presentation of Users & Client Data; original save/edit logic stays intact. */
window.renderUsers=function(){
  const users=Object.entries(data('users')||{}).map(([id,x])=>({...x,id}));

  rows.forEach(r=>{r.orderCount=allAdminOrders.filter(o=>cleanA(o.customerPhone||o.receiverPhone||o.phone)===r.p).length;});

};

try{db.ref('client_data').on('value',function(){if(S.tab==='users')render();});db.ref('users').on('value',function(){if(S.tab==='users')render();});db.ref('orders').on('value',function(){if(S.tab==='users')render();});}catch(e){console.warn('User live listener upgrade',e);}

<script id="mf-admin-final-upgrade">
(function(){

  return media.find(Boolean)||it?.imageUrl||it?.image||it?.img||it?.img1||it?.img2||x.image||x.imageUrl||x.img||x.img1||x.img2||x.mediaUrls?.[0]||'';

 '<div class="section"><h3>Bill Summary</h3><div class="muted">Items: ₹'+Number(bd.itemsTotal||0).toLocaleString('en-IN')+'<br>Delivery: ₹'+Number(bd.deliveryCharge||0).toLocaleString('en-IN')+'<br>Handling: ₹'+Number(bd.handlingCharge||0).toLocaleString('en-IN')+'<br>COD Extra: ₹'+Number(bd.codExtraCharge||0).toLocaleString('en-IN')+'<br>Tip: ₹'+Number(bd.deliveryTip||0).toLocaleString('en-IN')+'<br><b style="font-size:19px;color:#172019">Grand Total: ₹'+total.toLocaleString('en-IN')+'</b></div></div>'+

 '<div class="order-address">'+esc2(o.deliveryAddress||o.address||'No address')+'</div>'+
 '<div class="order-items">'+(items.map(i=>esc2(i.title||i.name||'Item')+' × '+Number(i.qty||i.quantity||1)+' — ₹'+Number(i.price||i.total||0).toLocaleString('en-IN')).join('<br>')||'No item details')+'</div>'+itemCollectionHtml(items)+

 '<div class="actions" style="margin-top:8px"><button class="btn small" onclick="orderDetails2(\''+encodeURIComponent(idv)+'\')">Full Details</button><button class="btn '+(mk?'amber':'green')+' small" onclick="toggleMarkedOrder(\''+esc2(idv)+'\')">'+(mk?'Unmark':'✓ Mark')+'</button>'+(status!=='Cancelled'?'<button class="btn red small" onclick="cancelOrder(\''+encodeURIComponent(idv)+'\')">Cancel</button>':'')+'</div></div>';

/* Nav dots + live activity state. */
const seenKey=k=>'mf_admin_seen_'+k;
function maxTime(node){let m=0;Object.values(node||{}).forEach(x=>{const t=Number(x?.timestamp||x?.createdAt||x?.ratedAt||x?.lastLoginAt||0);if(t>m)m=t});return m}
function unread(k,node){return maxTime(node)>Number(localStorage.getItem(seenKey(k))||0)}
function markSeen(k,node){localStorage.setItem(seenKey(k),String(maxTime(node)||Date.now()));updateNavDots()}
function updateNavDots(){
 const maps=[['orders',data('orders')||data('admin')?.orders],['complaints',data('complaints')],['users',data('users')],['ratings',data('ratings')],['notices',data('notices')]];
 document.querySelectorAll('.navbtn').forEach(b=>{const t=b.textContent.toLowerCase();let k=null;if(t.includes('orders'))k='orders';else if(t.includes('complaints'))k='complaints';else if(t.includes('users'))k='users';else if(t.includes('ratings'))k='ratings';else if(t.includes('notices'))k='notices';if(!k)return;const pair=maps.find(x=>x[0]===k);const on=unread(k,pair?.[1]);if(on&&!b.querySelector('.mf-alert-dot'))b.insertAdjacentHTML('beforeend',' <span class="mf-alert-dot"></span>');if(!on)b.querySelector('.mf-alert-dot')?.remove()});
 const bo=document.getElementById('bOrders');if(bo){const on=unread('orders',data('orders')||data('admin')?.orders);if(on&&!bo.querySelector('.mf-alert-dot'))bo.insertAdjacentHTML('beforeend','<span class="mf-alert-dot"></span>');if(!on)bo.querySelector('.mf-alert-dot')?.remove()}
}
const oldGo=window.go;window.go=function(tab){if(tab==='orders')markSeen('orders',data('orders')||data('admin')?.orders);if(tab==='complaints')markSeen('complaints',data('complaints'));if(tab==='users')markSeen('users',data('users'));if(tab==='ratings')markSeen('ratings',data('ratings'));if(tab==='notices')markSeen('notices',data('notices'));return oldGo.apply(this,arguments)};
function beep(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.045;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.12)}catch(e){}}
let initialized={orders:false,complaints:false,users:false,ratings:false,notices:false};
function activityWatch(){['orders','complaints','users','ratings','notices'].forEach(k=>{db.ref(k==='orders'?'orders':k).on('value',snap=>{const v=snap.val()||{};S.data[k]=v;const isNew=unread(k,v);if(initialized[k]&&isNew)beep();initialized[k]=true;updateNavDots();if(S.tab===k)render();if(k==='orders'&&S.tab==='home')renderHome2();})})}

/* Add Ratings tab without removing existing tabs. */
if(!tabs.ratings){tabs.ratings='App Ratings';}
const oldRender=window.render;window.render=function(){if(S.tab==='ratings')return renderRatings();return oldRender.apply(this,arguments)};

/* Extra admin_ui listener. */
try{db.ref('admin_ui').on('value',s=>{S.data.admin_ui=s.val()||{};updateNavDots();if(S.tab==='orders'||S.tab==='home')render()});db.ref('ratings').on('value',s=>{S.data.ratings=s.val()||{};updateNavDots();if(S.tab==='ratings'||S.tab==='home')render()});db.ref('app_content').on('value',s=>{S.data.app_content=s.val()||{};if(S.tab==='apptext')renderAppTextManager()})}catch(e){console.warn(e)}
activityWatch();
setTimeout(updateNavDots,100);

<script id="mf-admin-v10-targeted-fix">
(function(){

 const raw=ordersRaw(),out=[];
 Object.entries(raw||{}).forEach(([fbKey,o])=>{
   if(!o||typeof o!=='object'||!o.rating)return;
   const rt=o.rating||{};const its=itemsOf(o);const phone=o.customerPhone||o.receiverPhone||o.phone||'';const rec=userRecByPhone(phone);
   out.push({id:'order__'+fbKey,kind:'order',fbKey,order:o,rating:Number(rt.rating)||0,review:rt.review||'',ratedAt:rt.ratedAt||rt.timestamp||0,
     phone:userPhone(rec)||phone,email:o.email||userEmail(rec),name:o.receiverName||o.customerName||o.name||userName(rec),address:o.deliveryAddress||o.address||rec.address?.address||'',city:o.deliveryCity||o.city||userCity(rec),area:o.deliveryAreaOnly||o.area||userArea(rec),items:its,adminMarked:rt.adminMarked===true});
 });return out;

function appRatingRecords(){
 return Object.entries(data('ratings')||{}).map(([id,x])=>{const r=userRecByPhone(x?.phone||id);return {id:'app__'+id,kind:'app',fbKey:id,rating:Number(x?.rating)||0,review:x?.review||'',ratedAt:x?.ratedAt||x?.timestamp||0,phone:x?.phone||userPhone(r),email:x?.email||userEmail(r),name:x?.userName||userName(r),address:x?.address||r.address?.address||'',city:x?.city||userCity(r),area:x?.area||userArea(r),items:[],adminMarked:x?.adminMarked===true};});
}

function findUserByPhone(phone){const p=DIG(phone),users=data('users')||{},clients=data('client_data')||{};let hit=null;for(const [id,u] of Object.entries(users)){if(DIG(u?.phone||id)===p){hit=[id,u||{}];break}}const idv=hit?hit[0]:KEY(p),u=hit?hit[1]:{},c=clients[idv]||clients[KEY(p)]||clients[p]||{};const addrs=addressesOf(c,u);const address=addrs.find(x=>x?.isSelected)||addrs[0]||null;return {id:idv,u,c,address};}

function itemLine(it){const p=productFor(it),src=(p?.mediaUrls||[])[0]||it?.imageUrl||it?.image||it?.img||p?.image||'';return '<div class="mf-order-item">'+(src?'<img src="'+E(src)+'" loading="lazy">':'<div style="height:70px;border-radius:9px;background:#eef2ef;display:grid;place-items:center;font-size:9px">No image</div>')+'<b>'+E(itemName(it))+'</b><small>Qty '+itemQty(it)+(itemUnit(it)?' • '+E(itemUnit(it)):'')+' • ₹'+itemPrice(it).toLocaleString('en-IN')+'</small></div>'}

window.orderDetailsV11=function(enc){const idv=decodeURIComponent(enc),o=orderFind(idv);if(!o){notify('Order details not found','error');return}const bd=o.billBreakdown||{},items=orderItems(o),phone=o.receiverPhone||o.customerPhone||o.phone||'',r=findUserByPhone(phone),email=firstEmail(o.email,r.u?.email,r.c?.profile?.email,r.c?.email),addr=o.deliveryAddress||o.address||r.address?.address||'Address not provided',city=cityFor(phone,o),area=areaFor(phone,o);openSheet('Order '+idv,'<div class="section"><h3>Customer</h3><div class="muted"><b>'+E(o.receiverName||o.customerName||o.name||nameFor(phone,o))+'</b><br>'+E(phoneFor(phone,o))+(email?'<br>'+E(email):'')+'</div></div><div class="section"><h3>Delivery Address</h3><div class="muted">'+E(o.addressType||r.address?.type||'Address')+'<br>'+E(addr)+'<br>'+E([area,city].filter(Boolean).join(' • '))+'</div></div><div class="section"><h3>Products Breakdown ('+items.length+')</h3>'+fullItems(items)+'</div><div class="section"><h3>Order Information</h3><div class="muted">Order ID: <b>'+E(o.orderId||o.id||idv)+'</b><br>Date & Time: '+E(o.orderDate||o.createdAt||'')+'<br>Status: '+E(o.orderStatus||'Placed')+'<br>Payment: '+E(o.paymentMethod||'')+' • '+E(o.paymentStatus||'')+'<br>Customer note: '+E(o.note||o.notes||o.instructions||'—')+'</div></div><div class="section"><h3>Bill Summary</h3><div class="muted">Items: ₹'+Number(bd.itemsTotal||0).toLocaleString('en-IN')+'<br>Delivery: ₹'+Number(bd.deliveryCharge||0).toLocaleString('en-IN')+'<br>Handling: ₹'+Number(bd.handlingCharge||0).toLocaleString('en-IN')+'<br>COD Extra: ₹'+Number(bd.codExtraCharge||0).toLocaleString('en-IN')+'<br>Tip: ₹'+Number(bd.deliveryTip||0).toLocaleString('en-IN')+'<br><b style="font-size:19px">Grand Total: ₹'+Number(bd.grandTotal??o.totalAmount??o.total??0).toLocaleString('en-IN')+'</b></div></div><div class="section"><h3>Raw Order Data</h3><div class="jsonbox">'+E(JSON.stringify(o,null,2))+'</div></div><button type="button" class="btn red full" onclick= <script>
(function(){
  'use strict';
  const jobs=window.__mfImageUploadPromises=window.__mfImageUploadPromises||{};
  const escLocal=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // Product uploads: parallel Firebase Storage uploads, unlimited gallery URLs,
  // and a safe data-URL fallback only when Storage is unavailable/slow.
  window.uploadProductMedia=async function(input,targetId,multiple=false){
    const files=[...(input?.files||[])].filter(f=>/^image\//i.test(f.type));
    if(!files.length)return;
    const target=document.getElementById(targetId);
    if(!target)return;
    target.dataset.uploading='1';
    const status=input.parentElement?.querySelector('.mf-upload-status');
    if(status)status.textContent=`Uploading ${files.length} image${files.length>1?'s':''}…`;

    const task=(async()=>{
      try{
        // Upload all selected images at the same time instead of one-by-one.
        const uploaded=await Promise.all(files.map(async file=>{
          let url='';
          if(typeof storage!=='undefined' && storage){
            try{
              const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
              const ref=storage.ref(`admin/products/${Date.now()}_${Math.random().toString(36).slice(2,9)}_${safeName}`);
              const uploadTask=ref.put(file,{contentType:file.type,cacheControl:'public,max-age=31536000'});
              const snap=await Promise.race([
                uploadTask,
                new Promise((_,rej)=>setTimeout(()=>rej(new Error('storage-timeout')),12000))
              ]);
              url=await snap.ref.getDownloadURL();
            }catch(e){
              window.__mfStorageFallback=(e&&(e.code||e.message))||'unknown';
              url=await imageToDataUrl(file,2048,.88);
            }
          }else{
            window.__mfStorageFallback='storage-unavailable';
            url=await imageToDataUrl(file,2048,.88);
          }
          return url||'';
        }));
        const urls=uploaded.filter(Boolean);
        if(multiple){
          const old=target.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
          target.value=[...new Set([...old,...urls])].join('\n');
        }else if(urls[0]){
          target.value=urls[0];
        }
        target.dataset.uploading='';
        target.dispatchEvent(new Event('input',{bubbles:true}));
        renderMediaPreviews();
        if(status)status.textContent=urls.length?`${urls.length} image${urls.length>1?'s':''} ready`:'No valid image selected';
        if(window.__mfStorageFallback&&urls.length){
          const why=window.__mfStorageFallback;window.__mfStorageFallback='';
          if(status)status.textContent='⚠ Firebase Storage fail ('+why+') — image product ke andar (base64) save hui, app slow ho sakta hai. Storage fix karo.';
          notify('Storage upload fail ('+why+') — image base64 mein save hui','info');
          return urls;
        }
        notify(urls.length?`Image${urls.length>1?'s':''} uploaded successfully`:'No valid image selected',urls.length?'success':'error');
        return urls;
      }catch(e){
        target.dataset.uploading='';
        if(status)status.textContent='Upload failed — please try again.';
        notify('Product image upload failed: '+(e?.message||e),'error');
        return [];
      }finally{
        target.dataset.uploading='';
      }
    })();

    // Keep the latest task plus any concurrent task for this target.
    const previous=jobs[targetId];
    jobs[targetId]=previous?Promise.allSettled([previous,task]).then(()=>true):task;
    return task;
  };

  // Unlimited gallery file rows. The old 6-slot restriction is intentionally removed.
  window.addGalleryFileInput=function(){
    const wrap=document.getElementById('mfGalleryFileInputs');
    if(!wrap)return;
    const row=document.createElement('div');
    row.style.cssText='display:flex;gap:7px;align-items:center;margin-top:7px';
    row.innerHTML=`<input type="file" accept="image/*" onchange="uploadProductMedia(this,'pGalleryUrls',true)" style="flex:1"><button type="button" class="btn red small" onclick="this.parentElement.remove()">Remove</button>`;
    wrap.appendChild(row);
  };

  function mediaList(){
    const main=(document.getElementById('pImage')?.value||'').trim();
    const gallery=(document.getElementById('pGalleryUrls')?.value||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
    return {main,gallery:[...new Set(gallery.filter(x=>x!==main))]};
  }

  window.removeMainProductImage=function(){
    const el=document.getElementById('pImage');
    if(el){el.value='';el.dataset.uploading='';el.dispatchEvent(new Event('input',{bubbles:true}));}
    renderMediaPreviews();
  };
  window.removeProductGalleryImage=function(index){
    const el=document.getElementById('pGalleryUrls');
    if(!el)return;
    const urls=el.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
    urls.splice(index,1);
    el.value=urls.join('\n');
    el.dispatchEvent(new Event('input',{bubbles:true}));
    renderMediaPreviews();
  };

  window.renderMediaPreviews=function(){
    const mainEl=document.getElementById('pImage');
    const galleryEl=document.getElementById('pGalleryUrls');
    if(!mainEl||!galleryEl)return;
    const main=mainEl.value.trim();
    let mainWrap=document.getElementById('mfMainImagePreview');
    if(!mainWrap){
      mainWrap=document.createElement('div');mainWrap.id='mfMainImagePreview';mainWrap.className='mf-main-preview';
      mainEl.parentElement.appendChild(mainWrap);
    }
    mainWrap.innerHTML=main?`<img src="${escLocal(main)}" alt="Main product image" onerror="this.style.opacity='.35'"><button type="button" class="mf-media-remove" title="Remove main image" onclick="removeMainProductImage()">×</button>`:'<div class="upload-note">No main image selected.</div>';

    let grid=document.getElementById('mfGalleryPreviewGrid');
    if(!grid){
      grid=document.createElement('div');grid.id='mfGalleryPreviewGrid';grid.className='mf-media-preview-grid';
      galleryEl.parentElement.appendChild(grid);
    }
    const urls=galleryEl.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
    grid.innerHTML=urls.length?urls.map((url,i)=>`<div class="mf-media-preview-card"><img src="${escLocal(url)}" alt="Gallery image ${i+1}" onerror="this.style.opacity='.35'"><button type="button" class="mf-media-remove" title="Remove gallery image" onclick="removeProductGalleryImage(${i})">×</button><small>Gallery image ${i+1}</small></div>`).join(''):'<div class="upload-note">No gallery images added yet.</div>';
  };

  function addListeners(){
    const main=document.getElementById('pImage'), gallery=document.getElementById('pGalleryUrls');
    if(!main||!gallery)return;
    if(main.dataset.mfPreviewBound!=='1'){
      main.dataset.mfPreviewBound='1';main.addEventListener('input',renderMediaPreviews);
    }
    if(gallery.dataset.mfPreviewBound!=='1'){
      gallery.dataset.mfPreviewBound='1';gallery.addEventListener('input',renderMediaPreviews);
    }
    renderMediaPreviews();
  }

  // Wrap the existing product form without replacing/removing any original fields.
  const originalProductForm=window.productForm;
  if(typeof originalProductForm==='function'){
    window.productForm=function(){
      const args=arguments;
      const result=originalProductForm.apply(this,args);
      setTimeout(addListeners,0);
      setTimeout(addListeners,80);
      return result;
    };
  }

  // Make save wait on every active upload, including concurrent gallery uploads.
  window.waitForImageUploads=async function(ids,timeout=90000){
    const start=Date.now();
    while(Date.now()-start<timeout){
      const pending=ids.map(k=>jobs[k]).filter(Boolean);
      if(pending.length) await Promise.allSettled(pending);
      let busy=false;
      for(const idv of ids){if(document.getElementById(idv)?.dataset?.uploading==='1'){busy=true;break}}
      if(!busy)return true;
      await new Promise(r=>setTimeout(r,80));
    }
    return false;
  };
})();
</script>

<script id="gomandi-admin-servicearea-2026-10-01">
(function(){

  /* ---------- Kodular native GPS bridge (same pattern as the Delivery app) ---------- */

    lat=Number(lat);lng=Number(lng);
    if(!isFinite(lat)||!isFinite(lng)||(lat===0&&lng===0))return;
    window.__mfAdminGps={lat:lat,lng:lng,accuracy:Number(acc)||0,updatedAt:Date.now()};

  /* ---------- Mappls SDK loader (standalone copy for this app) ---------- */
  var mapplsPromise=null;
  function mapplsToken(){return String(window.GOMANDI_MAPPLS_STATIC_KEY||'');}
  function mapplsReady(){return !!mapplsToken()&&mapplsToken().indexOf('PASTE_YOUR_')!==0;}
  function loadMappls(){
    if(typeof mappls!=='undefined')return Promise.resolve();
    if(!mapplsReady())return Promise.reject(new Error('Mappls key not configured'));
    if(mapplsPromise)return mapplsPromise;
    mapplsPromise=new Promise(function(resolve,reject){
      var s=document.createElement('script');
      s.src='https://sdk.mappls.com/map/sdk/web?v=3.0&access_token='+encodeURIComponent(mapplsToken());
      s.async=true;s.defer=true;
      s.onload=function(){resolve();};
      s.onerror=function(){reject(new Error('Mappls SDK load failed'));};
      document.head.appendChild(s);

    return mapplsPromise;
  }

  function getAdminCurrentPos(){

      if(window.__mfAdminGps){resolve(window.__mfAdminGps);return;}
      if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(
          function(p){resolve({lat:p.coords.latitude,lng:p.coords.longitude});},
          function(){resolve({lat:22.5726,lng:88.3639});},
          {enableHighAccuracy:true,timeout:8000}
        );
      }else resolve({lat:22.5726,lng:88.3639});
    });
  }

  /* ---------- Firebase helpers for serviceAreas/{pushId} = {name,lat,lng,radiusKm} ---------- */
  function serviceAreaList(){return arr(data('serviceAreas'));}
  window.saveServiceArea=function(idv,lat,lng,radiusKm,name){
    name=(name||'').trim()||('Zone '+new Date().toLocaleDateString('en-IN'));
    radiusKm=Number(radiusKm);
    if(!isFinite(lat)||!isFinite(lng)){notify('Pehle map par tap karke jagah chuno','error');return;}
    if(!radiusKm||radiusKm<=0){notify('Sahi range (km) daalo','error');return;}
    var ref=idv?db.ref('serviceAreas/'+idv):db.ref('serviceAreas').push();
    ref.set({name:name,lat:lat,lng:lng,radiusKm:radiusKm,updatedAt:Date.now()}).then(function(){
      notify('Service area saved successfully','success');
      window.__mfSAPending=null;
      render();

  };
  window.deleteServiceArea=function(idv){
    if(!confirm('Yeh service area delete karna hai?'))return;

  };
  window.editServiceArea=function(idv){
