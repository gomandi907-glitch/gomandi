    setTimeout(function(){var el=document.getElementById('saMapWrap');if(el)el.scrollIntoView({behavior:'smooth'});},80);
  };

  var saMap=null,saMarkers={};
  function saDrawExisting(){
    if(!saMap)return;
    Object.keys(saMarkers).forEach(function(k){try{mappls.remove({map:saMap,layer:saMarkers[k]});}catch(e){}});
    saMarkers={};
    serviceAreaList().forEach(function(z){
      try{
        var m=new mappls.Marker({map:saMap,position:{lat:z.lat,lng:z.lng},fitbounds:false,
          html:'<div style="background:#0c831f;color:#fff;border:2px solid #fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.3)"><i class="fa-solid fa-circle-dot"></i></div>'});
        saMarkers[z.id]=m;
        try{
          var ring=saCirclePolygonPoints(z.lat,z.lng,z.radiusKm);
          new mappls.Polygon({map:saMap,paths:ring,fillColor:'#0c831f',fillOpacity:0.14,strokeColor:'#0c831f',strokeOpacity:0.7,strokeWeight:2});
        }catch(ce){try{new mappls.Circle({map:saMap,center:{lat:z.lat,lng:z.lng},radius:z.radiusKm*1000,fillColor:'#0c831f',fillOpacity:0.14,strokeColor:'#0c831f',strokeOpacity:0.7,strokeWeight:2});}catch(ce2){}}
      }catch(e){}
    });
  }

  var saPickMarker=null,saMeMarker=null,saPendingLatLng=null,saLocalityTimer=null;
  function saReverseGeocode(lat,lng){
    return fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lng+'&zoom=16&addressdetails=1')
      .then(function(r){return r.json();})
      .then(function(d){return (d&&d.display_name)||'';}).catch(function(){return '';});
  }
  function saCirclePolygonPoints(lat,lng,radiusKm){
    var pts=[],R=6371,bearSteps=64;
    for(var i=0;i<=bearSteps;i++){
      var brng=(i*(360/bearSteps))*Math.PI/180;
      var lat1=lat*Math.PI/180,lng1=lng*Math.PI/180;
      var dOverR=radiusKm/R;
      var lat2=Math.asin(Math.sin(lat1)*Math.cos(dOverR)+Math.cos(lat1)*Math.sin(dOverR)*Math.cos(brng));
      var lng2=lng1+Math.atan2(Math.sin(brng)*Math.sin(dOverR)*Math.cos(lat1),Math.cos(dOverR)-Math.sin(lat1)*Math.sin(lat2));
      pts.push({lat:lat2*180/Math.PI,lng:lng2*180/Math.PI});
    }
    return pts;
  }
  function saFindLocalitiesNearby(lat,lng,radiusKm){
    clearTimeout(saLocalityTimer);
    var listEl=document.getElementById('saLocalityList');
    if(listEl)listEl.innerHTML='<div class="empty">Dhoonda ja raha hai…</div>';
    saLocalityTimer=setTimeout(function(){
      var radiusM=Math.min(Math.round(radiusKm*1000),15000);
      var q='[out:json][timeout:15];(node["place"~"suburb|neighbourhood|village|town|hamlet"](around:'+radiusM+','+lat+','+lng+');way["highway"]["name"](around:'+radiusM+','+lat+','+lng+'););out tags center '+300+';';
      fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:q})
        .then(function(r){return r.json();})
        .then(function(d){
          var names={};
          (d.elements||[]).forEach(function(el){var n=el.tags&&el.tags.name;if(n)names[n]=true;});
          var arr=Object.keys(names).sort();
          if(!listEl)return;
          if(!arr.length){listEl.innerHTML='<div class="empty">Is range me koi named area OpenStreetMap par nahi mila (chhote/naye areas kabhi list me nahi hote).</div>';return;}
          listEl.innerHTML=arr.map(function(n){return '<span style="background:#eef7ef;color:#0c831f;border:1px solid #cdeccf;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:600">'+esc(n)+'</span>';}).join('');
        }).catch(function(){if(listEl)listEl.innerHTML='<div class="empty">Locality list abhi load nahi ho payi.</div>';});
    },700);
  }
  function saInitMap(){
    /* Har baar yeh screen render hoti hai, #saMapEl ek bilkul NAYA DOM node
       hota hai — isliye purana map-instance yahin reset karna zaroori hai,
       warna wo purane (ab hata diye gaye) node se chipka reh jata hai aur
       naya box khaali dikhta hai (Edit dabane par yahi ho raha tha). */
    saMap=null;saPickMarker=null;saMeMarker=null;saMarkers={};
    var pending=window.__mfSAPending;
    getAdminCurrentPos().then(function(pos){
      var centerLat=pending?pending.lat:pos.lat, centerLng=pending?pending.lng:pos.lng;
      loadMappls().then(function(){
        setTimeout(function(){
          var el=document.getElementById('saMapEl');
          if(!el)return;
          saMap=new mappls.Map('saMapEl',{center:[centerLat,centerLng],zoom:15,zoomControl:true});
          saMap.on('load',function(){
            saDrawExisting();
            try{saMeMarker=new mappls.Marker({map:saMap,position:{lat:pos.lat,lng:pos.lng},fitbounds:false,html:'<div style="width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 4px rgba(26,115,232,.3)"></div>'});}catch(e){}
            saMap.on('click',function(e){
              var ll=e&&e.lngLat?{lat:e.lngLat.lat,lng:e.lngLat.lng}:null;
              if(!ll)return;
              saPendingLatLng=ll;
              if(saPickMarker){try{mappls.remove({map:saMap,layer:saPickMarker});}catch(ex2){}}
              saPickMarker=new mappls.Marker({map:saMap,position:ll,fitbounds:false,html:'<div style="font-size:32px;color:#e53935;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))"><i class="fa-solid fa-location-dot"></i></div>'});
              var latEl=document.getElementById('saLat'),lngEl=document.getElementById('saLng');
              if(latEl)latEl.value=ll.lat.toFixed(6);
              if(lngEl)lngEl.value=ll.lng.toFixed(6);
              var addrEl=document.getElementById('saPickedAddr');
              if(addrEl)addrEl.textContent='Locating…';
              saReverseGeocode(ll.lat,ll.lng).then(function(a){if(addrEl)addrEl.textContent=a||'—';});
              var radiusNow=Number(document.getElementById('saRadius')?.value)||2;
              saFindLocalitiesNearby(ll.lat,ll.lng,radiusNow);
            });
          });
          if(pending){
            saPendingLatLng={lat:pending.lat,lng:pending.lng};
            saPickMarker=new mappls.Marker({map:saMap,position:{lat:pending.lat,lng:pending.lng},fitbounds:false,html:'<div style="font-size:32px;color:#e53935;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))"><i class="fa-solid fa-location-dot"></i></div>'});
            var addrEl2=document.getElementById('saPickedAddr');
            saReverseGeocode(pending.lat,pending.lng).then(function(a){if(addrEl2)addrEl2.textContent=a||'—';});
            saFindLocalitiesNearby(pending.lat,pending.lng,pending.radiusKm||2);
          }
        },120);
      }).catch(function(e){
        var el=document.getElementById('saMapEl');
        if(el)el.innerHTML='<div class="empty">Naksha load nahi ho paya: '+esc(e.message)+'</div>';
      });
    });
  }

  window.saSaveFromForm=function(){
    var lat=Number(document.getElementById('saLat')?.value||(saPendingLatLng&&saPendingLatLng.lat));
    var lng=Number(document.getElementById('saLng')?.value||(saPendingLatLng&&saPendingLatLng.lng));
    var radiusKm=Number(document.getElementById('saRadius')?.value);
    var name=document.getElementById('saName')?.value||'';
    var pending=window.__mfSAPending;
    window.saveServiceArea(pending?pending.id:null,lat,lng,radiusKm,name);
  };
  window.saCancelEdit=function(){window.__mfSAPending=null;saPendingLatLng=null;render();};
  window.saOnRadiusChange=function(){
    if(!saPendingLatLng)return;
    var radiusKm=Number(document.getElementById('saRadius')?.value)||2;
    saFindLocalitiesNearby(saPendingLatLng.lat,saPendingLatLng.lng,radiusKm);
  };

  window.renderServiceArea=function(){
    var pending=window.__mfSAPending;
    var list=serviceAreaList();
    document.getElementById('view').innerHTML=
      '<div class="hero"><h2>Service Area / Map Range</h2><p>Jahan jahan circle banaoge, wahi wahi area customer app me order le payega. Map par tap karke jagah chuno, range (km) daalo, Save dabao.</p></div>'+
      '<div class="section" id="saMapWrap"><div class="section-head"><div><h3>'+(pending?'Edit: '+esc(pending.name||''):'Add New Area')+'</h3><p>Map par tap karke exact jagah chuno.</p></div></div>'+
      '<div id="saMapEl" style="width:100%;height:280px;border-radius:14px;overflow:hidden;background:#eef2ef;margin-bottom:6px"></div>'+
      '<div style="font-size:11.5px;color:#777;margin-bottom:10px"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#1a73e8;margin-right:4px"></span>Aapki current location &nbsp;&nbsp; <span style="display:inline-block;width:10px;height:10px;background:#e53935;margin-right:4px"></span>Picked pin</div>'+
      '<div id="saPickedAddr" style="font-size:12.5px;color:#0c831f;font-weight:600;margin-bottom:12px;min-height:18px">Map par tap karke jagah chuno</div>'+
      '<div class="field"><label>Area Name</label><input id="saName" placeholder="e.g. Kolkata control" value="'+esc(pending?pending.name:'')+'"></div>'+
      '<div class="two">'+
        '<div class="field"><label>Latitude</label><input id="saLat" value="'+(pending?pending.lat:'')+'" placeholder="Map par tap karo" readonly></div>'+
        '<div class="field"><label>Longitude</label><input id="saLng" value="'+(pending?pending.lng:'')+'" placeholder="Map par tap karo" readonly></div>'+
      '</div>'+
      '<div class="field"><label>Range (km)</label><input id="saRadius" type="number" step="0.1" min="0.1" value="'+(pending?pending.radiusKm:'2')+'" placeholder="e.g. 2" oninput="window.saOnRadiusChange()"></div>'+
      '<div class="field"><label>Is range (km) me yeh areas milte hain</label><div id="saLocalityList" style="display:flex;flex-wrap:wrap;gap:6px">'+'<div class="empty">Pehle map par tap karo</div>'+'</div></div>'+
      '<div class="two">'+
        '<button class="btn green full" onclick="window.saSaveFromForm()">'+(pending?'Update Area':'Save Area')+'</button>'+
        (pending?'<button class="btn full" onclick="window.saCancelEdit()">Cancel</button>':'<span></span>')+
      '</div></div>'+
      '<div class="section"><div class="section-head"><div><h3>Saved Areas ('+list.length+')</h3><p>Har state/city ka apna range alag se.</p></div></div>'+
      (list.length?list.map(function(z){
        return '<div class="row"><div class="grow"><strong>'+esc(z.name)+'</strong><small>'+Number(z.lat).toFixed(4)+', '+Number(z.lng).toFixed(4)+' • '+z.radiusKm+' km range</small></div><div class="actions"><button class="btn small" onclick="window.editServiceArea(\''+esc(z.id)+'\')">Edit</button><button class="btn red small" onclick="window.deleteServiceArea(\''+esc(z.id)+'\')">Delete</button></div></div>';
      }).join(''):'<div class="empty">Abhi koi service area nahi bana. Upar map par tap karke pehla area banao.</div>')+
      '</div>';
    setTimeout(saInitMap,30);
  };

  /* ---------- Per-user "Seen — User Location" mini map in the user detail sheet ---------- */
  var userMap=null;
  var oldUserDetails=window.userDetails;
  if(typeof oldUserDetails==='function'){
    window.userDetails=function(enc){
      var r=oldUserDetails.apply(this,arguments);
      try{
        var idv=decodeURIComponent(enc);
        var c=data('client_data')?.[idv]||{};
        var addrs=Array.isArray(c.addresses)?c.addresses:[];
        var pick=addrs.find(function(a){return a&&a.isSelected&&a.lat!=null&&a.lng!=null;})||addrs.find(function(a){return a&&a.lat!=null&&a.lng!=null;});
        var body=document.getElementById('sheetBody');
        if(body){
          var wrap=document.createElement('div');
          wrap.className='section';
          if(pick){
            wrap.innerHTML='<div class="section-head"><div><h3>📍 Seen — User Location</h3><p>'+esc(pick.address||'')+'</p></div></div><div id="userLocMapEl" style="width:100%;height:220px;border-radius:14px;overflow:hidden;background:#eef2ef"></div>';
            body.appendChild(wrap);
            setTimeout(function(){
              loadMappls().then(function(){
                var el=document.getElementById('userLocMapEl');
                if(!el)return;
                userMap=new mappls.Map('userLocMapEl',{center:[pick.lat,pick.lng],zoom:15,zoomControl:true});
                userMap.on('load',function(){
                  try{new mappls.Marker({map:userMap,position:{lat:pick.lat,lng:pick.lng},fitbounds:false,html:'<div style="font-size:30px;color:#e53935"><i class="fa-solid fa-location-dot"></i></div>'});}catch(e){}
                });
              }).catch(function(e){var el=document.getElementById('userLocMapEl');if(el)el.innerHTML='<div class="empty">Naksha load nahi ho paya.</div>';});
            },30);
          }else{
            wrap.innerHTML='<div class="section-head"><div><h3>📍 Seen — User Location</h3><p>User ne abhi koi pinned address nahi banaya.</p></div></div>';
            body.appendChild(wrap);
          }
        }
      }catch(e){console.warn('user location map',e);}
      return r;
    };
  }
})();
</script>

<script id="mf-video-upload">
/* Product video upload — reuses the same Firebase Storage instance (`storage`) as image uploads.
   Only the download URL is saved on the product record (field: videoUrl). */
window.uploadProductVideo=async function(input,targetId){
  const file=(input&&input.files||[])[0];
  if(!file)return;
  const target=document.getElementById(targetId);
  const status=document.getElementById(targetId+'_status');
  const prog=document.getElementById(targetId+'_prog');
  const bar=prog&&prog.firstElementChild;
  const prev=document.getElementById(targetId+'_preview');
  const say=(t,bad)=>{if(status){status.textContent=t;status.style.color=bad?'#dc2626':''}};
  if(!target)return;
  if(!/^video\//i.test(file.type)){say('Sirf video file chuniye (MP4 / WebM).',true);notify('Invalid video file','error');input.value='';return}
  if(file.size>50*1024*1024){say('Video 50 MB se bada hai — chhota/compress karke upload karo.',true);notify('Video too large (max 50 MB)','error');input.value='';return}
  if(typeof storage==='undefined'||!storage){say('Firebase Storage available nahi hai — video URL manually paste kar sakte ho.',true);notify('Storage unavailable','error');return}
  target.dataset.uploading='1';
  if(prog){prog.style.display='block';if(bar)bar.style.width='0'}
  say('Uploading video… 0%');
  try{
    const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const ref=storage.ref('admin/products/videos/'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+'_'+safe);
    try{storage.setMaxUploadRetryTime(25000);storage.setMaxOperationRetryTime(25000)}catch(_){}
    const task=ref.put(file,{contentType:file.type,cacheControl:'public,max-age=31536000'});
    let lastBytes=0,lastMove=Date.now(),stalled=false;
    task.on('state_changed',s=>{if(s.bytesTransferred>lastBytes){lastBytes=s.bytesTransferred;lastMove=Date.now()}const pc=s.totalBytes?Math.round(s.bytesTransferred/s.totalBytes*100):0;if(bar)bar.style.width=pc+'%';say('Uploading video… '+pc+'%')});
    const watch=setInterval(()=>{if(Date.now()-lastMove>30000){stalled=true;clearInterval(watch);try{task.cancel()}catch(_){}}},3000);
    let snap;
    try{snap=await task}catch(err){if(stalled)throw new Error('30 sec tak 0% se aage nahi badha — Firebase Storage connect nahi ho raha (Storage rules / CORS / admin file ko local (content://) se kholna). Admin ko hosted https link se kholo ya Storage rules check karo.');throw err}finally{clearInterval(watch)}
    const url=await snap.ref.getDownloadURL();
    target.value=url;
    if(prev){prev.src=url;prev.style.display='block'}
    say('Video upload complete. Ab "Save Product Live" dabao.');
    notify('Video uploaded','success');
  }catch(e){
    say('Video upload fail'+(e&&e.code?' ['+e.code+']':'')+': '+((e&&e.message)||e)+' — dobara try karo. Baaki form data safe hai.',true);
    notify('Video upload failed','error');
  }finally{
    target.dataset.uploading='';
    if(prog)setTimeout(()=>{prog.style.display='none'},800);
  }
};
</script>
<script id="mf-cloudinary-upload">
/* FREE media upload via Cloudinary (unsigned preset). Used for product video + product images when configured.
   Firebase Storage code stays below as the fallback; only the final URL is saved on the product. */
(function(){
  var LS='mf_cloudinary_cfg';
  function readLS(){try{var c=JSON.parse(localStorage.getItem(LS)||'null');return c&&c.cloud&&c.preset?c:null}catch(e){return null}}
  function writeLS(c){try{localStorage.setItem(LS,JSON.stringify(c))}catch(e){}}
  var cfg=readLS();
  try{db.ref('media_config/cloudinary').once('value').then(function(s){var v=s.val();if(v&&v.cloud&&v.preset){cfg={cloud:String(v.cloud),preset:String(v.preset)};writeLS(cfg)}}).catch(function(){})}catch(e){}
  function askCfg(force){
    if(cfg&&!force)return cfg;
    var c=prompt('Cloudinary CLOUD NAME daalo (Cloudinary dashboard par milta hai):',cfg?cfg.cloud:'');if(!c)return null;
    var p=prompt('Cloudinary UNSIGNED UPLOAD PRESET ka naam daalo:',cfg?cfg.preset:'');if(!p)return null;
    cfg={cloud:c.trim(),preset:p.trim()};writeLS(cfg);
    try{db.ref('media_config/cloudinary').set(cfg)}catch(e){}
    return cfg;
  }
  window.mfSetCloudinary=function(){return askCfg(true)};
  function up(file,kind,onProg){
    return new Promise(function(res,rej){
      var xhr=new XMLHttpRequest();
      xhr.open('POST','https://api.cloudinary.com/v1_1/'+encodeURIComponent(cfg.cloud)+'/'+kind+'/upload');
      xhr.timeout=10*60*1000;
      xhr.upload.onprogress=function(e){if(e.lengthComputable&&onProg)onProg(Math.round(e.loaded/e.total*100))};
      xhr.onload=function(){
        var j={};try{j=JSON.parse(xhr.responseText)}catch(e){}
        if(xhr.status>=200&&xhr.status<300&&j.secure_url){res(j.secure_url)}
        else{var m=(j.error&&j.error.message)||('HTTP '+xhr.status);var err=new Error(m);err.status=xhr.status;rej(err)}
      };
      xhr.onerror=function(){rej(new Error('Network error — internet check karo'))};
      xhr.ontimeout=function(){rej(new Error('Upload timeout'))};
      var fd=new FormData();fd.append('file',file);fd.append('upload_preset',cfg.preset);
      xhr.send(fd);
    });
  }
  function tune(url,kind){ // lighter/faster delivery, same quality look
    if(kind==='video')return url.replace('/upload/','/upload/q_auto,f_mp4/');
    return url.replace('/upload/','/upload/q_auto,f_auto/');
  }
  var origVideo=window.uploadProductVideo,origMedia=window.uploadProductMedia;

  window.uploadProductVideo=async function(input,targetId){
    var file=(input&&input.files||[])[0];if(!file)return;
    if(!cfg&&!askCfg(false)){return typeof origVideo==='function'?origVideo(input,targetId):undefined}
    var target=document.getElementById(targetId),status=document.getElementById(targetId+'_status'),prog=document.getElementById(targetId+'_prog'),bar=prog&&prog.firstElementChild,prev=document.getElementById(targetId+'_preview');
    var say=function(t,bad){if(status){status.textContent=t;status.style.color=bad?'#dc2626':''}};
    if(!target)return;
    if(!/^video\//i.test(file.type)){say('Sirf video file chuniye (MP4 / WebM).',true);notify('Invalid video file','error');input.value='';return}
    if(file.size>100*1024*1024){say('Video 100 MB se bada hai — chhota/compress karke upload karo (free plan limit).',true);notify('Video too large (max 100 MB)','error');input.value='';return}
    target.dataset.uploading='1';if(prog){prog.style.display='block';if(bar)bar.style.width='0'}
    say('Uploading video… 0%');
    try{
      var url=tune(await up(file,'video',function(pc){if(bar)bar.style.width=pc+'%';say('Uploading video… '+pc+'%')}),'video');
      target.value=url;target.dispatchEvent(new Event('input',{bubbles:true}));
      if(prev){prev.src=url;prev.style.display='block'}
      say('Video upload complete (Cloudinary). Ab "Save Product Live" dabao.');notify('Video uploaded','success');
    }catch(e){
      if(e.status===400||e.status===401||e.status===404){cfg=null;try{localStorage.removeItem(LS)}catch(_){}}
      say('Video upload fail: '+(e.message||e)+(cfg?'':' — Cloud name / preset galat ho sakta hai, agli baar dobara poochhunga.'),true);notify('Video upload failed','error');
    }finally{target.dataset.uploading='';if(prog)setTimeout(function(){prog.style.display='none'},800)}
  };

  window.uploadProductMedia=async function(input,targetId,multiple){
    if(!cfg&&!askCfg(false)){return typeof origMedia==='function'?origMedia(input,targetId,multiple):undefined}
    var files=[].slice.call((input&&input.files)||[]).filter(function(f){return /^image\//i.test(f.type)});
    if(!files.length)return;
    var target=document.getElementById(targetId);if(!target)return;
    var status=input.parentElement&&input.parentElement.querySelector('.mf-upload-status');
    target.dataset.uploading='1';
    if(status)status.textContent='Uploading '+files.length+' image'+(files.length>1?'s':'')+'…';
    try{
      var urls=await Promise.all(files.map(function(f){return up(f,'image').then(function(u){return tune(u,'image')})}));
      if(multiple){var old=target.value.split(/\r?\n/).map(function(x){return x.trim()}).filter(Boolean);target.value=old.concat(urls.filter(function(u){return old.indexOf(u)<0})).join('\n')}
      else target.value=urls[0];
      target.dispatchEvent(new Event('input',{bubbles:true}));
      if(typeof window.renderMediaPreviews==='function')window.renderMediaPreviews();
      if(status)status.textContent=urls.length+' image'+(urls.length>1?'s':'')+' ready (Cloudinary)';
      notify('Image'+(urls.length>1?'s':'')+' uploaded successfully','success');return urls;
    }catch(e){
      if(e.status===400||e.status===401||e.status===404){cfg=null;try{localStorage.removeItem(LS)}catch(_){}}
      if(status)status.textContent='Image upload fail: '+(e.message||e);
      notify('Image upload failed: '+(e.message||e),'error');return [];
    }finally{target.dataset.uploading=''}
  };
})();
</script>
