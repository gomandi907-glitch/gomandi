<title>GoMandi Bill</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:#fff;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#111}
#bill{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 28px);position:relative;overflow-x:hidden}
.x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;width:38px;height:38px;border-radius:50%;border:1px solid #e8e8ee;background:#fff;font-size:20px;line-height:36px;text-align:center;color:#444;cursor:pointer;z-index:9}
.x:active{transform:scale(.92)}
h1{font-size:24px;font-weight:500;letter-spacing:-.4px;margin-top:26px}
h2{font-size:24px;font-weight:500;color:#1a6fe0;letter-spacing:-.4px;margin-bottom:34px}
.pr{width:min(270px,76vw);height:38px;border-radius:14px 14px 18px 18px;background:linear-gradient(#2a3347,#0d111b 55%,#05070c);box-shadow:0 14px 26px -8px rgba(15,20,40,.55),inset 0 1px 0 rgba(255,255,255,.18);position:relative;z-index:3}
.pr:after{content:"";position:absolute;left:12px;right:12px;bottom:7px;height:3px;border-radius:3px;background:#000;box-shadow:0 1px 0 rgba(255,255,255,.12)}
.pr.on:after{background:#6aa8ff;box-shadow:0 0 10px #4b8dff;animation:gl .5s infinite alternate}
@keyframes gl{to{opacity:.4}}
.fd{width:min(236px,66vw);overflow:hidden;height:0;position:relative;z-index:2;margin-top:-2px;padding:0 0 18px;margin-bottom:-18px}
.fd:before{content:"";position:absolute;inset:0 -30px;pointer-events:none}
.rc{width:100%;background:#fff;color:#111;font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:9.5px;line-height:1.45;padding:14px 13px 22px;position:relative;filter:drop-shadow(0 12px 18px rgba(30,40,90,.22));will-change:transform;
-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/10px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/10px 100%}
.rc .hd{display:flex;align-items:center;gap:7px}
.rc .hd img{height:30px;width:auto}
.rc .hd b{display:block;font:800 11px system-ui,sans-serif;letter-spacing:.4px;color:#1b3a8a}
.rc .hd i{font-style:normal;font-size:8px;color:#666}
.rc .cl{margin:9px 0 7px;padding:4px 6px;background:#f2f3f6;border:1px solid #e1e3ea;font-size:8.5px;display:flex;justify-content:space-between;gap:6px}
.big{font:800 24px system-ui,sans-serif;letter-spacing:-.5px;margin-top:2px}
.sm{font-size:8px;color:#555;margin-bottom:8px}
.ln{display:flex;justify-content:space-between;gap:6px}
.ln span:first-child{flex:1;min-width:0;word-break:break-word}
hr{border:0;border-top:1px dashed #bbb;margin:7px 0}
.t b{font-size:11px}
.neg{color:#d6285b}
.ty{text-align:center;font-size:8px;font-weight:700;margin:9px 0 6px;letter-spacing:.2px}
.bc{display:block;width:100%;height:34px}
.bi{text-align:center;font-size:8px;color:#333;margin-top:2px;letter-spacing:1px}
.stp{position:absolute;right:8px;top:74px;transform:rotate(-12deg) scale(1);border:2px solid;padding:2px 7px;font:800 14px system-ui,sans-serif;letter-spacing:1.5px;text-align:center;border-radius:4px;opacity:0;mix-blend-mode:multiply}
.stp small{display:block;font-size:6.5px;letter-spacing:.5px;font-weight:700}
.stp.ok{color:#d12a3f;border-color:#d12a3f}
.stp.cod{color:#d9770a;border-color:#d9770a;font-size:11px}
.stp.pd{color:#6b7280;border-color:#6b7280}
.stp.show{animation:st .45s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes st{0%{opacity:0;transform:rotate(-12deg) scale(2.2)}60%{opacity:.95}100%{opacity:.88;transform:rotate(-12deg) scale(1)}}
.st{margin-top:44px;text-align:center}
.st h3{font-size:16px;font-weight:600;letter-spacing:-.2px;transition:opacity .25s}
.st p{font-size:11.5px;color:#777;margin-top:3px;transition:opacity .25s}
.bt{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.b{display:flex;align-items:center;gap:6px;padding:9px 13px;border-radius:10px;border:1px solid #e6e6ec;background:#fff;font:600 12px system-ui,sans-serif;color:#222;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:transform .15s,opacity .2s}
.b:active{transform:scale(.95)}
.b svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.b.p{background:#fff3ea;border-color:#f6d9c4;color:#8a4a1c}
.b.dn{background:#111;color:#fff;border-color:#111}
.b[disabled]{opacity:.55;pointer-events:none}
.pop{opacity:0;transform:translateY(8px);transition:.35s}.pop.in{opacity:1;transform:none}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translate(-50%,20px);background:#111;color:#fff;font:600 12px system-ui;padding:9px 16px;border-radius:20px;opacity:0;transition:.3s;z-index:20;pointer-events:none}
#toast.in{opacity:1;transform:translate(-50%,0)}
@media print{body *{visibility:hidden}.fd,.fd *{visibility:visible}.fd{position:absolute;left:0;top:0;width:100%;height:auto!important;overflow:visible}.rc{transform:none!important;filter:none}}
